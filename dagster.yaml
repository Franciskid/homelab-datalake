# Dagster phones home by default. Turn that off -- and note this is not only a
# privacy preference, it is load-bearing for the ai_automations code location.
#
# The instance settings here travel to a run worker inside the InstanceRef the
# daemon hands it over gRPC. That worker for an ai_automations job runs in the
# `ai-automations` container, which is `read_only: true`, and Dagster's
# telemetry writes an instance id under $HOME/.dagster BEFORE doing anything
# else. With telemetry on, every automation run there died with
# "OSError: [Errno 30] Read-only file system: '/home/dagster/.dagster'" -- and
# reported as a bare GeneratorExit on the step, which points nowhere near the
# cause. `_get_instance_telemetry_info` only touches the filesystem when
# telemetry is enabled, so switching it off removes the write entirely rather
# than papering over it with a writable mount.
telemetry:
  enabled: false

# Mounted read-only into dagster-webserver and dagster-daemon at
# $DAGSTER_HOME/dagster.yaml. See docker-compose.yml.
#
# Before this file existed, DAGSTER_HOME had no dagster.yaml at all, so both
# containers ran on Dagster's built-in defaults: run history in
# history/runs.db, schedule state in schedules/schedules.db, both SQLite.
# SQLite there is a single-process/development-mode choice, not a
# multi-writer database -- and workspace.yaml (see that file) now loads a
# second code location, ai_automations, served by its own container. When
# dagster-daemon launches one of that location's jobs, the run and event
# writes happen from a subprocess inside THAT container, not this one, so
# two separate processes are writing run/event data concurrently. SQLite
# does not support that; Postgres does, which is why all three stores below
# move there together.
#
# run_storage, event_log_storage and schedule_storage all point at the SAME
# database (DAGSTER_PG_DB), on purpose: Dagster's Postgres storage classes
# each own a disjoint set of tables in one schema (runs/run_tags/... for
# run_storage, event_logs/... for event_log_storage, jobs/instigators/...
# for schedule_storage), and one shared database is what Dagster's own docs
# assume for this shape -- splitting them across separate databases buys
# nothing and only adds connections to manage.
#
# Every value below is env-var indirection (`env:`), never a literal, so no
# credential is ever committed here. See .env.example for
# DAGSTER_PG_HOST/PORT/DB/USER/PASSWORD and docs/ for the one-time database
# provisioning this depends on.
run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

# The prometheus_stream sensor ticks every minute -- [count withheld] ticks a day, each recorded in
# Postgres. A tick that writes parts and launches no run is recorded as skipped, and its
# message ("wrote [count withheld] samples ... lag 71 s") is only useful while it is recent. Failed
# ticks are kept a month, because they are what explains a gap.
retention:
  sensor:
    purge_after_days:
      skipped: 3
      failure: 30
      success: 30

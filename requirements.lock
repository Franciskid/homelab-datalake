# Every Python package the image installs, at the exact version it runs.
#
# pyproject.toml says what the code needs (`duckdb>=1.1`); this file says what the image
# gets. Without it every rebuild resolved afresh, and on 2026-09-29 an unrelated rebuild
# pulled SQLAlchemy 2.1, which broke Dagster's Postgres storage until it was pinned back.
# The Dockerfile installs this file, then the project with --no-deps, then runs
# `pip check`, so a dependency added to pyproject.toml but not locked fails the build.
#
# Resolved in python:3.12-slim on x86_64, the image and host prod runs. To upgrade,
# change pyproject.toml, run scripts/lock-dependencies.sh, rebuild, and check Dagster.

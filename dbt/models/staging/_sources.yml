version: 2

sources:
  - name: raw
    description: >
      Parquet landed by Dagster, loaded into DuckDB by the warehouse_tables asset.
      Rebuilt in full from the lake on every run, so it cannot drift from object storage.
    schema: raw
    tables:
      - name: npm_access
        description: One row per HTTP request seen by an Nginx Proxy Manager instance.
        columns:
          - name: dt
            description: >
              Partition date: the UTC day of the request, taken from the timestamp
              inside the line and never from the file it was found in. logrotate moves
              a day's lines between files weekly, so the filename is not evidence.
          - name: host
            description: >
              The `host=` segment of the object path, which NPM instance the partition
              belongs to. Identical to host_source; both are present because a reader
              that globs the prefix gets one from the path and one from the data.
          - name: host_source
            description: >
              Which Nginx Proxy Manager instance logged the line -- `primary`, which
              fronts 44 hosts, or `secondary`, which fronts the camera. The two run on
              different machines and fail independently, which is why it is half of
              the partition key.
          - name: timestamp
            description: >
              When nginx logged the request, converted to UTC at ingest. nginx writes a
              local offset; normalising here is what makes a 23:[count withheld] request land on the
              same day whoever runs the job.
          - name: log_format
            description: >
              Which of NPM's three line formats this row was parsed from: `proxy`,
              `standard`, or stock nginx `combined`. Only `proxy` carries the upstream
              and Sent-to fields, so nulls in those are a property of the format rather
              than missing data.
          - name: request_host
            description: >
              The Host header the client sent. Client-controlled, so scanners put bare
              addresses in it; kept exactly as sent rather than cleaned, because a
              scanner probing the IP directly is a fact worth counting.
          - name: method
            description: >
              The HTTP method as written in the request line. Null when the request line
              did not parse -- almost always TLS bytes sent to port 80.
          - name: scheme
            description: >
              `http` or `https`, as nginx saw the connection. Absent from the `combined`
              format, which does not log it.
          - name: path
            description: >
              The request path with the query string removed. Query strings carry
              password-reset tokens, session ids and API keys often enough that storing
              them is a bet with no upside; the path is what analysis needs.
          - name: status
            description: The HTTP status nginx returned to the client.
          - name: upstream_status
            description: >
              The status the upstream returned, as text rather than a number: a retry
              produces several, comma-separated ("502, 200"). Only the `proxy` format
              has it.
          - name: cache_status
            description: >
              nginx's $upstream_cache_status -- HIT, MISS, EXPIRED and so on. Only the
              `proxy` format has it.
          - name: bytes_sent
            description: Response body size in bytes, excluding headers.
          - name: user_agent
            description: >
              The User-Agent header verbatim. It is the only evidence the
              bot-versus-browser classification downstream has.
          - name: sent_to
            description: >
              The upstream nginx forwarded to ($server). Only the `proxy` format has it.
          - name: client_hash
            description: >
              Salted HMAC-SHA256 of the client address, truncated to 16 bytes. The
              address itself is destroyed in memory at ingest and never written, so this
              is what makes a distinct-visitor count possible without keeping one. HMAC
              rather than a plain digest: there are only 2^32 IPv4 addresses, and an
              unkeyed digest of one is brute-forced in minutes.
          - name: client_network
            description: >
              The client address truncated to its /24 (IPv4) or /48 (IPv6). Wide enough
              not to single out a household, narrow enough to separate a datacentre
              range from a home ISP.
          - name: client_trust
            description: >
              Whether the logged address named a visitor (`resolved`) or a Cloudflare
              machine standing in for one (`cdn_edge`); `unknown` when there was no
              usable address. Two meaningful values and not three: after the 27 Aug 2026
              real-IP cutover a restored address and an always-direct one are
              byte-identical, so claiming to tell them apart would assert something the
              data does not contain.
          - name: client_version
            description: 4 or 6 -- the IP version of the address, recorded before it was discarded.
          - name: client_is_private
            description: >
              Whether the address was in a private range, which means the request came
              from inside the LAN rather than from the internet.
          - name: geo_country_code
            description: >
              ISO country code from MaxMind, resolved while the address was still in
              hand and before the privacy boundary discarded it. Null throughout when no
              GeoLite2 database is configured -- geo enrichment is optional on purpose,
              so CI never needs a licence key.
          - name: geo_country_name
            description: The country's English name from MaxMind. Null when geo enrichment is not configured.
          - name: geo_city
            description: >
              City from MaxMind's city database. Frequently null even when enrichment is
              on: MaxMind resolves a city for far fewer addresses than a country.
          - name: geo_asn
            description: >
              Autonomous system number of the network the address belonged to. Null when
              enrichment is not configured.
          - name: geo_as_org
            description: >
              The organisation that owns that autonomous system -- the operator name a
              person recognises, such as an ISP or a cloud provider.
          - name: source_file
            description: >
              Basename of the log file the line was read from. Diagnostic only: it says
              which rotation generation a row came out of. Nothing downstream groups by it.
          - name: referer
            description: >
              The Referer header the client sent. Parsed from every line since this
              pipeline was written, carried on the parsed row, and then left out of the
              schema -- so it was read and discarded on every line for a month. It is
              how a link somebody followed is told apart from a URL somebody typed.
          - name: gzip_ratio
            description: >
              nginx's $gzip_ratio for the response. Null when the response was not
              compressed, which is itself a fact about the response. Absent from the
              `combined` format, which does not log it.
          - name: has_query
            description: >
              Whether the request carried a query string. The string itself is still
              removed -- see `path` -- so this is what is left of the fact that there
              was one.
          - name: query_param_names
            description: >
              The parameter *names* the request carried, sorted and de-duplicated, and
              never their values. The values are the dangerous half -- a reset token, a
              session id, an API key -- and dropping them is right; the names are an
              ordinary question about one's own estate, and dropping the whole query
              string left "which endpoints take a token parameter" unanswerable. Each
              name is truncated to 64 characters, because a scanner can put a kilobyte
              of junk in one and this column exists to be grouped by.

      - name: npm_access_rejects
        description: >
          Lines no log format matched, kept with their raw text. Never dropped: the
          reject rate is a data-quality signal, and a silent drop would hide a format change.
        columns:
          - name: dt
            description: >
              The partition being built when the line was found. A reject has no usable
              timestamp -- that is why it is a reject -- so it cannot be placed by its
              own contents and is attributed to the day under construction.
          - name: host
            description: Which NPM instance the unparseable line came from.
          - name: source_file
            description: Basename of the log file the line was read from.
          - name: reason
            description: >
              Why no format matched -- which check failed. The field to group by when the
              reject rate rises, because a format change produces one reason many times.
          - name: raw_line
            description: >
              The line itself, truncated to 2000 characters. Kept so a new log format can
              be recognised from the data rather than guessed at from the server.

      - name: litellm_spend
        description: >
          One row per LLM call from LiteLLM's spend ledger. Prompt and completion
          payloads are never selected; caller address, API key and end user are hashed
          at the ingestion boundary.
        columns:
          - name: dt
            description: >
              Partition date: the UTC day the call started. LiteLLM stores timestamps
              without a zone, already in UTC, and the ingest attaches UTC explicitly so
              the partition filter cannot drift with a session setting.
          - name: request_id
            description: LiteLLM's own identifier for the call. Unique, and the key the fact table uses.
          - name: session_id
            description: >
              Groups the calls of one conversation or one agent run. Null for a call made
              outside a session.
          - name: started_at
            description: When the proxy accepted the request (LiteLLM's startTime), in UTC.
          - name: ended_at
            description: When the response completed (endTime), in UTC.
          - name: first_token_at
            description: >
              When the first token of the completion arrived (completionStartTime). The
              difference from started_at is what a person actually feels as latency,
              which is a different question from total duration.
          - name: call_type
            description: >
              What LiteLLM was asked to do -- `acompletion`, `completion`, `responses`, an
              embedding call, or one of the MCP calls. Grouped into a coarser `workload`
              downstream.
          - name: model
            description: The model as named in the request, including any provider prefix.
          - name: model_group
            description: >
              LiteLLM's routing group -- the alias several concrete models can sit behind.
              Null when the request named a model directly.
          - name: provider
            description: >
              LiteLLM's custom_llm_provider: who served the call. Null on a large minority
              of rows, which is why the self-hosted flag downstream coalesces rather than
              comparing directly.
          - name: mcp_tool
            description: >
              The namespaced MCP tool a tool call invoked. Null for an ordinary completion.
          - name: status
            description: >
              `success` or `failure`, as the proxy recorded it. Empty in the ledger
              becomes `unknown` downstream rather than being assumed successful.
          - name: spend_usd
            description: >
              What LiteLLM billed for the call, in US dollars. Taken from the ledger and
              never recomputed: a second copy of every model's price list would drift
              from the proxy's and then quietly disagree with the bill.
          - name: total_tokens
            description: Prompt and completion tokens together, as counted by the provider.
          - name: prompt_tokens
            description: Tokens in the input.
          - name: completion_tokens
            description: Tokens generated.
          - name: duration_ms
            description: End-to-end duration of the call in milliseconds, from the proxy's view.
          - name: cache_hit
            description: >
              LiteLLM's raw three-state value: '' for a miss, 'True'/'true' for a hit.
              Flattened to a boolean downstream, where unknown counts as a miss --
              an uncached call is what got billed.
          - name: team_id
            description: The LiteLLM team the API key belongs to. Null when the key is not in a team.
          - name: end_user
            description: >
              Salted hash of LiteLLM's end_user field, not the value itself. The field is
              caller-supplied and can carry an address or an account name, so it goes
              through the same boundary as everything else identifying.
          - name: api_key_hash
            description: >
              Salted hash of the API key. The column upstream mixes 64-character hashes
              and 24-character literals with nothing to tell them apart, so it is treated
              as a credential and hashed either way. "Spend per key" survives; the risk
              does not.
          - name: client_hash
            description: Salted hash of the caller's address, through the same boundary as the proxy logs.
          - name: client_network
            description: The caller's address truncated to its /24 or /48.
          - name: client_trust
            description: Whether the caller's address named a client or a CDN edge.
          - name: geo_country_code
            description: Country of the caller, resolved before the address was discarded. Null without a GeoLite2 database.
          - name: geo_asn
            description: Autonomous system number of the caller's network.
          - name: geo_as_org
            description: Operator of that autonomous system.
          - name: model_id
            description: The specific deployment of the model that served the call, where the group has several.
          - name: api_base
            description: Which upstream endpoint the call went to. Says whether a model was served locally or by a provider.
          - name: cache_key
            description: >
              The key the proxy cached the response under. Two calls sharing one asked
              the same question; `cache_hit` says whether the second was served from it.
          - name: organization_id
            description: The organisation the call was billed to. Empty on this deployment today.
          - name: agent_id
            description: The agent that made the call, where one did. Empty on this deployment today.
          - name: user_hash
            description: >
              Salted hash of LiteLLM's own end-user label, which is distinct from
              `end_user`. Hashed on the same boundary as every other caller identity.
          - name: request_tags
            description: The tags the caller attached to the request. Populated on most calls.
          - name: cached_tokens
            description: >
              How many prompt tokens were served from the provider's cache. Null when
              the provider did not report it, which is not the same as zero: a model
              that cached nothing reports zero, and one whose provider is silent is
              unknown. `total_tokens` cannot tell a cached prompt from a fresh one, so
              a cost-per-token figure computed from it alone was wrong.
          - name: prompt_audio_tokens
            description: Audio tokens in the prompt. Null when not reported.
          - name: reasoning_tokens
            description: >
              How many tokens the model spent on hidden reasoning. Null when not
              reported. Counted inside completion_tokens, so it explains a call that
              looks expensive for the answer it produced.
          - name: completion_audio_tokens
            description: Audio tokens in the completion. Null when not reported.
          - name: accepted_prediction_tokens
            description: Predicted-output tokens the model accepted. Null when not reported.
          - name: rejected_prediction_tokens
            description: Predicted-output tokens the model rejected. Null when not reported.
          - name: input_cost_usd
            description: >
              What the prompt cost, separately from the answer. `spend_usd` is the two
              added together, which could not answer the first question anybody asks of
              an LLM bill.
          - name: output_cost_usd
            description: What the completion cost.
          - name: tool_usage_cost_usd
            description: What tool calls within the request cost, where any were charged.
          - name: original_cost_usd
            description: The cost before any discount or margin was applied.
          - name: discount_amount_usd
            description: How much was discounted from the original cost.
          - name: attempted_retries
            description: >
              How many times the proxy retried before this call succeeded or gave up. A
              rising figure is an upstream in trouble, which no other column shows.
          - name: max_retries
            description: How many retries the proxy was willing to make.
          - name: litellm_overhead_ms
            description: >
              How long the proxy itself took, as distinct from the model. Separates
              "the model was slow" from "the gateway was".
          - name: applied_guardrails
            description: Which guardrails ran on the call. Empty when none did.
          - name: api_key_alias
            description: >
              The human-readable name of the key that made the call, where it has one.
              The key itself is hashed; this is what a person recognises.
          - name: team_alias
            description: The human-readable name of the team the call was billed to.
          - name: model_map_key
            description: The entry in the proxy's model map that resolved the request. Says which alias a caller actually asked for.
          - name: error_information
            description: JSON. Why a call failed, when one did. Null on a successful call.
          - name: metadata_json
            description: >
              JSON. LiteLLM's metadata blob, whole and unfiltered. The extracted scalar
              columns beside it are a convenience over this, not a filter on it.
          - name: requester_ip
            description: >
              The caller's address exactly as the ledger recorded it, beside the hashed
              and geo columns. On this deployment these are internal container
              addresses -- a fact about one's own infrastructure, unlike the proxy logs,
              where the addresses belong to visitors and stay hashed.
          - name: messages_json
            description: >
              JSON. The full prompt sent to the model. Empty on every row today because
              LiteLLM's payload logging is off; once it is switched on, every
              conversation through the gateway lands here and is readable by anything
              that can read the lake -- the SQL console, the workbench, and any agent
              granted the datalake tools.
          - name: response_json
            description: JSON. The model's full completion. Empty today, for the same reason as messages_json.
          - name: proxy_server_request_json
            description: JSON. The raw request the proxy received. Empty today, for the same reason as messages_json.

      - name: jellyfin_titles
        description: One row per movie per snapshot date. No paths, no playback history.
        columns:
          - name: dt
            description: >
              Snapshot date: the day this reading of the library was taken. Today's date
              rather than yesterday's, because a snapshot describes the library now and
              dating it yesterday would invent a past that never existed.
          - name: item_id
            description: Jellyfin's item id. Stable across snapshots, and the key SCD2 history is built on.
          - name: title
            description: >
              The title as Jellyfin displays it, which in this library is usually the
              localised name rather than the original.
          - name: original_title
            description: >
              The title as released. Comes from Jellyfin, which fetched it from TMDB
              during the scan -- [rate withheld] coverage, so there is no reason to ask TMDB again.
          - name: production_year
            description: Year of production as Jellyfin holds it.
          - name: premiere_date
            description: Release date. Null for titles Jellyfin never matched to a provider record.
          - name: added_at
            description: When the file was added to the library (Jellyfin's DateCreated), in UTC.
          - name: community_rating
            description: >
              TMDB's vote average, which is what Jellyfin's CommunityRating is. Kept from
              the snapshot rather than re-fetched -- the enrichment step deliberately does
              not ask TMDB for a figure the library already holds.
          - name: critic_rating
            description: Critic score where Jellyfin has one. Sparse across this library.
          - name: official_rating
            description: Age or content certification, in whichever national scheme Jellyfin matched.
          - name: runtime_minutes
            description: >
              Runtime as reported by the container metadata, converted from Jellyfin's
              100-nanosecond ticks. Some mpeg2video DVD rips report an order of magnitude
              too long; the value is kept exactly as reported and flagged downstream
              rather than corrected, because inventing a plausible runtime would put a
              fabricated number in the warehouse and hide the problem.
          - name: container
            description: The file container -- mkv, mp4 and so on.
          - name: video_codec
            description: Codec of the primary video stream.
          - name: video_height
            description: >
              Height in pixels of the primary video stream. Real values here are not neat
              standards -- 1080, 1040, 1036, 816, 804 -- because encodes are letterboxed
              and cropped.
          - name: video_width
            description: Width in pixels of the primary video stream.
          - name: video_bit_depth
            description: >
              Bits per colour channel. This is what says whether a file is HDR, not the
              codec: hevc is routinely 8-bit and 10-bit h264 exists.
          - name: resolution_class
            description: >
              Height bucketed into 4K / 1080p / 720p / SD / low. Banded rather than
              matched on equality, with each boundary set below the nominal height, so a
              cropped 1080p encode still counts as 1080p instead of becoming its own
              category.
          - name: audio_codec
            description: Codec of the primary audio stream.
          - name: audio_channels
            description: Channel count of the primary audio stream -- 2 for stereo, 6 for 5.1.
          - name: tmdb_id
            description: >
              TMDB identifier, stored by Jellyfin when it matched the file. Present on
              [rate withheld] of titles, which is what lets enrichment be a key lookup rather than
              a title search -- so a film cannot pick up another film's box office.
          - name: imdb_id
            description: IMDb identifier, where Jellyfin matched one.
          - name: studio
            description: The first studio Jellyfin lists for the title.
          - name: production_country
            description: >
              First entry of Jellyfin's ProductionLocations, which it fetched from TMDB
              during the scan. [rate withheld] coverage, so TMDB is not asked for it again.
          - name: decade
            description: production_year rounded down to its decade, derived at ingest so every reader agrees on it.
          - name: tmdb_collection_id
            description: >
              The franchise the film belongs to, as TMDB numbers them. Two films sharing
              this are episodes of one series, which no other column here says.
          - name: tvdb_id
            description: The film's TVDB id, where Jellyfin matched one.
          - name: studios
            description: >
              Every studio credited, in the order the API gave them. `studio` above is
              the first of these. One title in this library has twenty-five, and keeping
              only the first described a co-production as the work of one company.
          - name: production_countries
            description: >
              Every production country, primary first. `production_country` above is the
              first of these.
          - name: sort_name
            description: The name the library sorts by, which drops leading articles.
          - name: overview
            description: >
              The film's synopsis. Held back originally as prose no question asked
              about, which was true until somebody asked one. Unlike `Path` it is a fact
              about the film rather than about this installation.
          - name: tagline
            description: The film's marketing line, first one only. The full list is in `taglines`.
          - name: taglines
            description: Every tagline the library holds for the film.
          - name: tags
            description: Free-form tags applied to the title in the library.
          - name: parent_id
            description: The library folder the title sits in.
          - name: item_type
            description: Jellyfin's own type for the row. Always Movie for this snapshot, kept so that stays checkable.
          - name: media_type
            description: The kind of media -- Video for everything in this library.
          - name: video_type
            description: How the video is stored -- a single file, a disc image, a folder.
          - name: has_subtitles
            description: Whether the library believes the title has subtitles at all. The detail is in jellyfin_title_streams.
          - name: subtitle_languages
            description: >
              Distinct subtitle languages across the title's streams, sorted. Derived at
              ingest so the common question -- what can I watch in French -- does not
              need the stream table.
          - name: audio_languages
            description: Distinct audio languages across the title's streams, sorted.
          - name: stream_count
            description: How many media streams the title has in total.
          - name: chapter_count
            description: How many chapter markers the file carries.
          - name: remote_trailer_count
            description: How many trailers the library knows about for the title.
          - name: external_urls
            description: >
              The film's pages on public databases, as name and url pairs. Public
              references, not anything about this installation.
          - name: file_size_bytes
            description: >
              Size of the primary media file. The one figure worth taking from
              MediaSources, which is otherwise transcoding capability rather than
              analytics -- and the figure a library-growth question needs.
          - name: file_bitrate
            description: Overall bitrate of the primary media file.
          - name: media_source_count
            description: How many media sources the title has. More than one means several versions of the same film.
          - name: _unmapped
            description: >
              JSON. Any field Jellyfin returned that nothing here reads, kept rather
              than dropped. Fields deliberately not stored -- `Path` above all -- are
              excluded from it, so a non-null value here is always a prompt to add a
              column rather than noise.

      - name: jellyfin_title_streams
        description: >
          One row per media stream: every audio, video and subtitle track. This table
          exists because keeping the first video and the first audio stream and
          discarding the rest lost every subtitle track in the library and every audio
          track after the first -- so a bilingual film with thirty-four subtitle tracks
          was recorded as having one of each.

          Stream file paths are never stored, for the same reason the title's Path is
          not: an external subtitle sits on disk beside the film.
        columns:
          - name: dt
            description: "Partition date: the day of the snapshot this stream was seen in."
          - name: item_id
            description: The title the stream belongs to. Joins to jellyfin_titles.item_id.
          - name: stream_index
            description: The stream's position in the file. Unique within a title, and half of the natural key.
          - name: stream_type
            description: Video, Audio, Subtitle, or EmbeddedImage.
          - name: codec
            description: How the stream is encoded -- h264, ac3, subrip.
          - name: language
            description: The stream's language as a three-letter code. Null when the file does not declare one.
          - name: title
            description: The label the file gives the stream -- "VFF 5.1 @384Kbps".
          - name: display_title
            description: >
              Jellyfin's own rendering of the stream -- "1080p H264 SDR". Worth keeping
              beside the derived resolution class, which disagrees with it on cropped
              encodes: a 1080p film letterboxed to [count withheld] rows is called 720p by the band
              table and 1080p here.
          - name: is_default
            description: Whether this is the track that plays without the viewer choosing.
          - name: is_forced
            description: Whether the track is forced -- shown even when subtitles are off.
          - name: is_external
            description: Whether the stream is a separate file rather than embedded in the container.
          - name: is_hearing_impaired
            description: Whether the subtitle track is marked as for the hearing impaired.
          - name: is_interlaced
            description: Whether the video is interlaced.
          - name: height
            description: Picture height in pixels. Zero on a subtitle stream.
          - name: width
            description: Picture width in pixels.
          - name: channels
            description: How many audio channels. 6 for 5.1, 2 for stereo.
          - name: channel_layout
            description: How those channels are arranged, as the encoder named it.
          - name: bit_rate
            description: The stream's bitrate, where the container declares one.
          - name: bit_depth
            description: Bits per colour sample. 10 marks an HDR-capable encode.
          - name: sample_rate
            description: Audio sample rate in hertz.
          - name: video_range
            description: SDR or HDR.
          - name: video_range_type
            description: Which HDR format, where the stream is HDR.
          - name: profile
            description: The codec profile the stream was encoded with.
          - name: level
            description: The codec level, which bounds resolution and bitrate.

      - name: jellyfin_title_people
        description: >
          Cast and crew credits, one row per person per title. Public film metadata --
          who acted in and made a film -- and not anything about anybody using this
          library.
        columns:
          - name: dt
            description: "Partition date: the day of the snapshot this credit was seen in."
          - name: item_id
            description: The title the credit belongs to. Joins to jellyfin_titles.item_id.
          - name: person_id
            description: Jellyfin's stable id for the person, so the same actor matches across films.
          - name: name
            description: The person's name as the library holds it.
          - name: person_type
            description: What they did -- Actor, Director, Writer, Producer.
          - name: role
            description: The character an actor played. Null for crew.
          - name: sort_order
            description: >
              Where the credit sits in the billing order, zero-based. Top billing is 0,
              which is how a leading role is told from a walk-on.

      - name: jellyfin_title_genres
        description: >
          Title-to-genre pairs. A separate table because a title has many genres and
          flattening them would mean a delimited string or genre_1/genre_2/genre_3.
        columns:
          - name: dt
            description: Snapshot date, matching the titles table for the same day.
          - name: item_id
            description: The Jellyfin item this genre belongs to.
          - name: genre
            description: >
              One genre name, as Jellyfin holds it -- a French display string on this
              deployment, which is why the dimension downstream is keyed by a hash of it
              rather than by the name.

      - name: camera_events
        description: >
          Attention events. Not final when first written: vision analysis lands hours
          later, so rows carry _extracted_at and the intermediate model keeps the
          newest version per event id.
        columns:
          - name: dt
            description: >
              Partition date: the UTC day the event started. The export is queried on a
              half-open [from, to) range, so adjacent days can neither double-count a row
              on the boundary nor drop one.
          - name: _extracted_at
            description: >
              When this pipeline read the export. The whole late-arrival mechanism rests
              on it: re-reading yesterday tomorrow legitimately returns different rows,
              and this is what says which reading a row came from.
          - name: id
            description: The camera's event id. Stable across re-reads, and the key the deduplication uses.
          - name: cameraId
            description: Which camera raised the event.
          - name: zoneId
            description: The attention zone the rule belongs to. The zone's shape is never exported -- polygon coordinates are a map of the property.
          - name: zoneName
            description: The zone's display name, as a person named it.
          - name: ruleId
            description: The zone rule that fired.
          - name: ruleType
            description: >
              What kind of rule fired -- `motion` or `state`. Deliberately not a statement
              about what happened: most real passages are persisted as `motion` and only
              become crossings once the clip analysis lands, so this is the trigger and
              not the conclusion.
          - name: lifecycle
            description: >
              `candidate` when first written, then `confirmed` or `dismissed` once vision
              analysis has run. A row still `candidate` hours later means the analysis
              pipeline is stuck.
          - name: startedAt
            description: ISO-8601 string of when the event began. Cast to a timestamp once, downstream.
          - name: completedAt
            description: ISO-8601 string of when the event was resolved. Null while the event is still a candidate.
          - name: clipId
            description: The clip that filmed the event, where one was kept. No path or URL is exported, only the id.
          - name: direction
            description: >
              The provisional direction of a crossing. Kept even when the threshold check
              rejected the crossing, so a rejection and a measured passage are told apart
              by other fields rather than by this one being cleared.
          - name: state
            description: >
              The zone's physical state at the event -- for a gate, `open` or `closed`;
              `partly_open` is a transient reading of the same position rather than a
              third state. Only set for state rules.
          - name: previousState
            description: The zone's state before this event. Equal to `state` means nothing moved, which is dismissed as `unchanged_state`.
          - name: stateObservedAt
            description: ISO-8601 string of when that state was observed. Null unless the event carries a state.
          - name: confidence
            description: >
              The vision model's confidence in its conclusion. Null is a real value and is
              not a low score -- it means the model declined to commit, and coalescing it
              to 0 would turn a refusal into a confident "no".
          - name: unusual
            description: Whether the analysis judged the event out of the ordinary for that zone and hour.
          - name: shouldNotify
            description: Whether the camera decided this was worth telling somebody about. Never true for a dismissed, duplicate or unchanged-state event.
          - name: dismissalReason
            description: >
              Why a dismissed event was dismissed -- `unchanged_state` when a state rule
              fired on no movement, or a reason from the analysis such as
              `semantic_no_event`.
          - name: duplicateOf
            description: The id of the event this one duplicates, when the camera recognised it as a repeat.
          - name: summary
            description: >
              The model's short description of what it saw, up to 800 characters. Free
              text, so nothing downstream groups by it.
          - name: occurredAt
            description: >
              When the event actually happened, which a replay or a repair moves away
              from startedAt. The camera's own report ranks on occurredAt falling back
              to startedAt, so anything here that wants to agree with it must too.
          - name: ruleId
            description: >
              The rule inside the zone that fired. Landed since the first partition and
              never surfaced downstream until now; it is the join to dim_camera_zone.
          - name: stateSource
            description: >
              How a state reading was arrived at, when the camera recorded it. Null on
              almost every row; present where a state was set by something other than
              the ordinary analysis path.
          - name: transitionClipId
            description: >
              The clip that filmed the gate moving. For a state change clipId shows a
              gate that has already finished moving, so a reader wanting the transition
              itself wants this one.
          - name: counts
            description: >
              How many of each subject the event counted, as a struct of person,
              vehicle, animal and other. Every graph of this data is a sum over these
              four. Null means nothing was counted, which is not the same as four
              zeroes: an event nobody counted is not an event that counted nobody.
          - name: dismissed
            description: >
              Whether the camera marked the event dismissed outright, as opposed to
              inferring it from lifecycle.
          - name: correction
            description: >
              What a person overwrote on this event, and what the machine had said
              before they did. The row's own columns are already the corrected values;
              `correction.previous` holds the machine's original account, and
              correctedAt, correctedByName and correctedByHash say when and by whom.
              Without it a figure a person changed is indistinguishable from one nobody
              touched.
          - name: backfill
            description: >
              JSON. Present when the row was written by a backfill rather than by the
              live path, with the reason and the instant.
          - name: repair
            description: >
              JSON. Present when the row was reconstructed by a repair, naming the
              incident it belongs to.
          - name: restoration
            description: >
              JSON. Present when the row was restored from a backup, naming the source.
          - name: timingCorrection
            description: >
              JSON. Present when the event's own timestamps were corrected, holding the
              previous occurredAt and stateObservedAt and the evidence for the change.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped. Non-null is the signal that the camera has started
              sending something worth giving a column to -- the signal whose absence
              lost `counts` on every row for a month.

      - name: camera_clips
        description: Clip metadata. No paths, playlists or thumbnails.
        columns:
          - name: dt
            description: >
              Partition date: the UTC day the clip was created.
          - name: _extracted_at
            description: When this pipeline read the export.
          - name: id
            description: The clip id. This is what an event's clipId points at.
          - name: cameraId
            description: Which camera recorded it.
          - name: kind
            description: >
              Why the clip exists -- `event` for one the detector triggered, `manual` for
              one a person started.
          - name: createdAt
            description: ISO-8601 string of when the recording was made.
          - name: savedAt
            description: ISO-8601 string of when it was written to permanent storage. Null while a clip is only in the rolling history.
          - name: durationSeconds
            description: Length of the clip in seconds, parsed from the display string the camera stores.
          - name: sizeBytes
            description: File size in bytes, parsed from the display string the camera stores.
          - name: segmentCount
            description: How many stored segments the clip is assembled from.
          - name: storageQuality
            description: The quality profile the clip was saved at, as a label.
          - name: archived
            description: Whether the clip has been moved out of the rolling history into the archive.
          - name: deleted
            description: >
              Whether the clip has been deleted. The metadata row survives the file, which
              is what keeps a count of recordings honest after a cleanup.
          - name: aiSource
            description: Which analyser produced the clip's AI verdict. Null on a clip that was never analysed.
          - name: aiType
            description: What that analyser concluded the clip shows.
          - name: localConfidence
            description: The on-device analyser's confidence, where it ran. Separate from an event's confidence, which comes from the vision model.
          - name: createdByHash
            description: >
              Salted hash of the person who started a manual recording -- enough to tell
              one person's recordings from another's without naming either. Null for a
              clip the detector triggered.
          - name: annotationCount
            description: How many annotations were left on the clip. 0, never null.
          - name: title
            description: >
              What the clip was labelled -- "1 personne". Generated from what the
              analysis found rather than prose anybody typed, and it is the caption the
              app itself shows. Sent on every clip and kept on none of them until now.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped, and reported by an asset check so it can be given a
              column.

      - name: camera_logs
        description: Activity log entries. Free-text titles are never exported.
        columns:
          - name: dt
            description: >
              Partition date: the UTC day the entry was written.
          - name: _extracted_at
            description: When this pipeline read the export.
          - name: id
            description: The log entry's id.
          - name: cameraId
            description: Which camera the entry is about.
          - name: type
            description: >
              What happened -- `motion`, `gate_transition`, `measured_crossing`,
              `analysis_completed`, `analysis_failed`, `analysis_corrected`,
              `recording_started`, `recording_saved`, `recording_deleted`. The type is
              what analysis needs; the prose that accompanies it is not exported, because
              on this deployment it contains @mentions.
          - name: important
            description: Whether the entry was flagged as important when it was written.
          - name: createdAt
            description: ISO-8601 string of when the entry was written.
          - name: sourceId
            description: The clip or annotation the entry is about, where it refers to one.
          - name: title
            description: >
              The entry's free text, as the person wrote it -- @mentions and all. Held
              back originally for that reason; landed at the owner's request, on the
              grounds that these are their own household's notes in their own
              installation. Expect the names of people they live with in it.
          - name: userHash
            description: Salted hash of the person who caused the entry. Null for anything the system did on its own.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped, and reported by an asset check so it can be given a
              column.

      - name: camera_zones
        description: >
          Attention-zone configuration, one row per zone and rule, snapshotted daily.
          The reference table the event stream never had: without it the only clue that
          a zone is a gate is that its events happen to carry ruleType 'state', which is
          inference from the data rather than a fact about the configuration -- and it
          says nothing at all about a zone that has fired no events.

          Never carries geometry. The polygon is a map of the property; the anchor and
          reference counts travel instead, which is what a "is this zone calibrated"
          question actually needs.
        columns:
          - name: dt
            description: >
              The day the snapshot was taken. Not backfillable: the camera keeps no
              history for a zone, so an older date here would describe events by rules
              that did not exist when they fired.
          - name: _extracted_at
            description: When this pipeline read the configuration.
          - name: id
            description: The zone's stable id. What camera_events.zoneId points at.
          - name: cameraId
            description: Which camera the zone is drawn on.
          - name: name
            description: The zone's display name -- "Portail", "Animaux".
          - name: enabled
            description: Whether the zone is switched on. A disabled zone fires nothing.
          - name: revision
            description: >
              How many times the zone has been edited. Rises on every change, so two
              snapshots with the same revision are the same configuration.
          - name: anchorCount
            description: >
              How many calibration anchors the zone holds. Zero means the zone has
              never been calibrated, which is the usual reason its state readings are
              unreliable.
          - name: stateReferenceCount
            description: How many reference images the zone holds for judging its state.
          - name: revisionCount
            description: >
              How many past configurations the zone keeps. Rises with every edit that
              was kept, so it says how much churn a zone has had.
          - name: feedbackCount
            description: >
              How many times a person has corrected what this zone concluded. A zone
              with a lot of feedback is one the model keeps getting wrong, which no
              count of events would show.
          - name: autoLearnAnchors
            description: Whether the zone re-learns its calibration anchors on its own.
          - name: maxAnchors
            description: How many anchors the zone is allowed to keep.
          - name: createdAt
            description: When the zone was first created. ISO-8601.
          - name: createdByHash
            description: Salted hash of whoever created the zone.
          - name: createdByName
            description: >
              The name of whoever created the zone. The name travels beside the hash
              here for the same reason it does on a correction: "who configured this"
              is not answered by a pseudonym.
          - name: updatedAt
            description: When the zone was last edited. ISO-8601.
          - name: updatedByHash
            description: Salted hash of whoever last edited the zone.
          - name: updatedByName
            description: The name of whoever last edited the zone.
          - name: description
            description: The free-text note describing what the zone is for, if one was written.
          - name: scope
            description: >
              Whether the zone covers drawn shapes or the whole frame. `frame` means the
              camera's entire picture rather than a region of it.
          - name: geometryRevision
            description: >
              How many times the shapes have changed, separately from the rules. A bump
              here means the region moved, which can explain a step change in event
              counts that no rule change would account for.
          - name: ruleId
            description: >
              The rule's id within the zone. What camera_events.ruleId points at. Null
              on a zone that has no rules configured -- such a zone still appears here
              rather than vanishing from the export.
          - name: ruleType
            description: >
              What the rule watches: `state` for a gate that is open or closed,
              `crossing` for passages through a threshold, `motion` for activity.
          - name: ruleName
            description: The rule's display name.
          - name: ruleEnabled
            description: Whether the rule is switched on, independently of the zone.
          - name: ruleNotify
            description: Whether a match sends a notification, as opposed to only being recorded.
          - name: ruleCooldownSec
            description: >
              How long the rule waits before it may fire again. A long cooldown is a
              reason a busy period shows fewer events than it had activity.
          - name: ruleSensitivity
            description: The sensitivity band the rule runs at.
          - name: rulePrompt
            description: >
              The analysis prompt the vision model is given. Configuration of the model
              rather than anything written about a person, and the only record of *why*
              a rule fires as it does.
          - name: ruleTargets
            description: Which subjects the rule looks for -- person, vehicle, and so on.
          - name: ruleStates
            description: The states a state rule may report, usually open and closed.
          - name: ruleAlertOn
            description: Which transitions raise an alert, as opposed to being recorded quietly.
          - name: shapesJson
            description: >
              JSON. The zone's polygons, as normalised frame coordinates. This is a map
              of where each watched region physically sits, landed at the owner's
              explicit request; the anchor and reference counts above answer most
              questions without parsing it. Anything that can read the lake can
              reconstruct the property layout from this column.
          - name: ignoreShapesJson
            description: JSON. Regions inside the zone that are deliberately excluded from analysis.
          - name: anchorsJson
            description: JSON. The calibration anchors the zone judges its state against.
          - name: stateReferencesJson
            description: JSON. The reference samples used to decide whether the zone reads open or closed.
          - name: anchorPolicyJson
            description: JSON. Whether the zone re-learns its anchors, and how many it may keep.
          - name: revisionsJson
            description: >
              JSON. Every past configuration of the zone, with the instant and the
              snapshot. How a step change in event counts is traced back to the edit
              that caused it.
          - name: feedbackJson
            description: >
              JSON. Every correction a person has made to what this zone concluded,
              with their verdict. The zone-level counterpart of an event correction.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped, and reported by an asset check so it can be given a
              column.

      - name: camera_observability
        description: >
          Spans where a zone could not be read, and why. The other half of every gate
          reading: with state events alone there is no way to tell "the gate stayed shut
          for six hours" from "nobody could see the gate for six hours", and a report
          drawing the second as the first is confidently wrong rather than incomplete.
        columns:
          - name: dt
            description: "Partition date: the UTC day the span starts in."
          - name: _extracted_at
            description: When this pipeline read the span.
          - name: id
            description: >
              Stable id for the span, built from the zone and the instant it began, so
              re-reading a window merges rather than duplicating.
          - name: cameraId
            description: The camera whose zone could not be read.
          - name: zoneId
            description: The zone that could not be read. Joins to camera_zones.id.
          - name: reason
            description: >
              Why the zone was unreadable. `night_blind` is darkness, `out_of_view` and
              `lost` are the tracker losing the region, `state_unconfirmed` is the
              freshness lease expiring rather than the picture going away -- which is a
              timing artefact and not a camera that cannot see.
          - name: detail
            description: Any extra explanation the camera recorded alongside the reason.
          - name: fromAt
            description: When the span began. ISO-8601.
          - name: toAt
            description: >
              When the span ended, or the end of the window asked for when it had not
              ended by then. Read with `ongoing`.
          - name: ongoing
            description: >
              Whether the span was still open at the end of the window. True means toAt
              is where the question stopped, not where the blindness did.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped, and reported by an asset check so it can be given a
              column.

      - name: camera_annotations
        description: >
          Notes and marks left against a clip or an event. The note itself is never
          exported -- people write asides and @mentions in it -- so what is here is that
          a note exists, on what, when, and by which pseudonymised person. Enough to ask
          which clips drew attention and which zones people keep returning to.
        columns:
          - name: dt
            description: "Partition date: the UTC day the annotation was written."
          - name: _extracted_at
            description: When this pipeline read the annotation.
          - name: id
            description: The annotation's stable id.
          - name: scope
            description: >
              Which kind of thing targetId points at -- `clip` for a saved recording,
              `live` for a camera. A reader joining without checking this would match a
              clip id against a camera id.
          - name: targetId
            description: The clip or camera the note was left on. Read with `scope`.
          - name: kind
            description: What kind of mark it is -- a note, an event marker, a reaction.
          - name: emoji
            description: The icon chosen for the mark, when one was.
          - name: offsetSec
            description: How far into the clip the mark sits, in seconds. Null for a live mark.
          - name: timestampMs
            description: The wall-clock instant the mark refers to, in epoch milliseconds.
          - name: createdAt
            description: When the annotation was written. ISO-8601.
          - name: text
            description: >
              The note itself, as written. Landed for the same reason the log title is.
          - name: userHash
            description: >
              Salted hash of the person who wrote it. Null for anything the system
              wrote on its own -- a zone marking its own analysis, for instance.
          - name: zoneId
            description: The zone the mark relates to, when it came from zone analysis.
          - name: ruleId
            description: The rule the mark relates to, when it came from zone analysis.
          - name: eventType
            description: The kind of event the mark was raised for.
          - name: _unmapped
            description: >
              JSON. Any field the export sent that this schema does not name, kept
              rather than dropped, and reported by an asset check so it can be given a
              column.

      - name: tmdb_titles
        description: >
          Budget, revenue, original language and vote counts from TMDB, keyed by the
          id Jellyfin already stored. A key lookup, never a title search, so a film
          cannot be enriched with another film's box office. Empty when no API key is
          configured -- enrichment is optional, exactly like geo.
        columns:
          - name: tmdb_id
            description: >
              TMDB's identifier, and the join key into the library. Not partitioned by
              date: this is a lookup rewritten in full, so a date in the path would only
              say when it was last refreshed, which the object's own mtime already says.
          - name: _enriched_at
            description: When this pipeline last asked TMDB about this id.
          - name: original_language
            description: ISO code of the language the film was made in. One of the few facts Jellyfin has no field for.
          - name: budget_usd
            description: >
              Production budget in US dollars. Null rather than 0 when TMDB has no figure:
              a film that cost nothing and a film nobody recorded a budget for are
              different rows, and averaging them together understates every box-office
              question.
          - name: revenue_usd
            description: Worldwide revenue in US dollars, null rather than 0 when unrecorded, for the same reason as budget_usd.
          - name: popularity
            description: TMDB's own popularity score. A relative, time-varying figure, so it is meaningful for ranking and not as an absolute.
          - name: vote_count
            description: >
              How many people rated the film on TMDB. Says whether to trust the average
              beside it.
          - name: vote_average
            description: >
              TMDB's rating out of ten. Jellyfin holds a copy of this as
              community_rating, taken when it scanned the file -- which can be years
              stale. Both are kept, each named for where it came from, because with only
              one there was no way to see that the copy had drifted.
          - name: runtime_minutes
            description: TMDB's runtime. Comparable against the library's own, which is measured from the file.
          - name: status
            description: Released, Post Production, Planned. A film in the library with a
              non-released status is usually a mismatched id.
          - name: tagline
            description: The film's marketing line, as TMDB holds it.
          - name: overview
            description: TMDB's synopsis. Comparable against the library's, which may be localised.
          - name: homepage
            description: The film's official site, where TMDB has one.
          - name: release_date
            description: TMDB's release date, as an ISO date string. The library's premiere_date is the same fact from its own scan.
          - name: imdb_id
            description: The film's IMDb id, as TMDB holds it. A second opinion on the library's own.
          - name: original_title
            description: The title as released, before any localisation.
          - name: title
            description: TMDB's primary title, which is usually the English one.
          - name: is_adult
            description: Whether TMDB flags the film as adult.
          - name: collection_id
            description: >
              The franchise the film belongs to. Two films sharing this are episodes of
              one series -- nothing else in this warehouse says so.
          - name: collection_name
            description: The franchise's name, for reading rather than joining.
          - name: genres
            description: TMDB's genres for the film. A second opinion on the library's own genre list.
          - name: production_companies
            description: Every company credited with producing the film.
          - name: production_countries
            description: Every country the film was produced in.
          - name: spoken_languages
            description: >
              The languages spoken in the film, by their English names. Distinct from
              the library's audio_languages, which is what tracks the file happens to
              carry.
          - name: origin_countries
            description: The country codes the film originates from.

      # -- the AI platform ------------------------------------------------------
      #
      # Thirteen of the fifty-two tables ai_platform_registry.py lands. The other
      # thirty-nine (agent_versions, budgets, mcp_servers, schedules, teams, and so
      # on) are queryable in the lake and the SQL console -- see layout.py, which
      # registers every one of them with a description -- but have no dbt source
      # here, because nothing in dbt/models references them. A table earns a
      # source() declaration when a staging model reads it, not on principle.
      #
      # `dt` means one of two different things depending on the table's mode in the
      # registry (see ai_platform_registry.py for MODE_WINDOW vs MODE_SNAPSHOT):
      # for a window table it is the UTC day of that row's own change column, and a
      # row appears under exactly one dt for the whole time it exists; for a
      # snapshot table it is the day the whole table was re-read, and a row that
      # never changes still appears once under every day since it was first seen.
      # Each table below says which it is.
      - name: platform_usage_events
        description: >
          One row per call through the api.ai gateway: application, key, person,
          requested and actual model, full prompt and response, tokens, cost,
          latency, status, and any camera frames attached. By the owner's
          2026-09-14 decision, prompt and response are landed in full -- see
          PLAN.md. `dt` is the UTC day of `created_at`; a row is re-extractable
          for WINDOW_DAYS after that, so a call whose gateway is still finishing
          up can still be corrected the same day it lands.
        columns:
          - name: dt
            description: Partition date -- the UTC day `created_at` falls on.
          - name: id
            description: The call's id. Unique; the key fct_ai_gateway_call uses.
          - name: application_id
            description: Which application made the call. Joins to platform_applications.
          - name: api_key_id
            description: Which API key made the call. Joins to platform_api_keys.
          - name: source
            description: What kind of caller this was -- an agent run, a schedule, a script, and so on.
          - name: client_name
            description: The calling client's self-reported name, where one was sent.
          - name: client_version
            description: The calling client's self-reported version.
          - name: actor_label
            description: A human-readable label for who or what triggered the call.
          - name: actor_external_id
            description: An external identifier for the actor, where the caller supplied one.
          - name: requested_model
            description: The model alias the caller asked for.
          - name: actual_model
            description: The model that actually served the call, after routing.
          - name: prompt
            description: >
              The full prompt sent to the model. Empty before 2026-09-14; whole
              text from that date, by the owner's decision -- see the module note
              in ai_platform_registry.py.
          - name: response
            description: The model's full response, same landing decision as `prompt`.
          - name: results
            description: JSON. Structured tool or function-call results the gateway recorded, where there were any.
          - name: input_tokens
            description: Prompt tokens, as the gateway counted them.
          - name: output_tokens
            description: Completion tokens.
          - name: cost_eur
            description: What the call was billed at, in EUR.
          - name: latency_ms
            description: End-to-end latency the gateway observed.
          - name: status
            description: success, failure, or whatever other outcome the gateway recorded.
          - name: failure_code
            description: Why the call failed, when it did. Null on success.
          - name: metadata
            description: >
              JSON. Everything else the gateway recorded about the call -- including
              `clipUrl` where a camera clip is attached -- with the base64 camera
              frames removed: those are decoded into lake objects and referenced by
              `frame_keys` instead. See ai_platform.py's frame-decoding note.
          - name: created_at
            description: When the call was recorded, in UTC.
          - name: conversation_id
            description: The conversation this call belongs to, where it belongs to one. Text, not a foreign key -- this column is stored as text in ai_platform itself.
          - name: frame_keys
            description: Lake object keys for the camera frames attached to this call's metadata, in order. Empty when there were none.
          - name: frame_count
            description: How many frames were successfully decoded. May be less than the number of entries in `metadata`'s original images list if any were malformed -- see the frame-count asset check.
          - name: frame_bytes
            description: Total bytes across the decoded frames.

      - name: platform_applications
        description: >
          Every application registered against the gateway, snapshotted whole
          every day (`dt` is the day of the snapshot, not a change date -- see the
          note above the AI platform block).
        columns:
          - name: dt
            description: Snapshot date -- the day this reading of the table was taken.
          - name: id
            description: The application's id.
          - name: created_by_user_id
            description: Who registered the application.
          - name: team_id
            description: The team the application belongs to, where it belongs to one.
          - name: name
            description: The application's display name.
          - name: environment
            description: Which environment this application represents -- production, staging, and so on.
          - name: status
            description: Whether the application is active.
          - name: metadata
            description: JSON. Free-form application metadata.
          - name: created_at
            description: When the application was registered.
          - name: updated_at
            description: When the application's configuration last changed.
          - name: model_aliases
            description: JSON. The model routing aliases configured for this application.
          - name: tool_profiles
            description: JSON. Which tool profiles this application may use.
          - name: monthly_budget_eur
            description: The application's monthly spend budget, in EUR, where one is set.
          - name: last_used_at
            description: When the application last made a call.
          - name: parent_application_id
            description: The application this one was derived from, where it has one.

      - name: platform_api_keys
        description: >
          Every API key issued to an application, snapshotted whole every day. The
          secret itself -- its hash, its ciphertext, and the id of the matching
          LiteLLM key -- is never selected; see ai_platform_registry.py.
        columns:
          - name: dt
            description: Snapshot date -- the day this reading of the table was taken.
          - name: id
            description: The key's id.
          - name: application_id
            description: Which application the key belongs to. Joins to platform_applications.
          - name: created_by_user_id
            description: Who issued the key.
          - name: label
            description: The key's human-readable name -- what a person recognises it by.
          - name: prefix
            description: The key's visible prefix, safe to display.
          - name: suffix
            description: The key's visible suffix, safe to display.
          - name: status
            description: active, revoked, and so on.
          - name: last_used_at
            description: When the key was last used to make a call.
          - name: revoked_at
            description: When the key was revoked, or null if it has not been.
          - name: created_at
            description: When the key was issued.
          - name: updated_at
            description: When the key's record last changed.

      - name: platform_runs
        description: >
          Every agent run -- one per turn of work, whether or not it called the
          gateway. The source for fct_agent_run. `dt` is the UTC day of
          `started_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `started_at` falls on.
          - name: id
            description: The run's id.
          - name: conversation_id
            description: Which conversation this run belongs to. Joins to platform_conversations.
          - name: initiated_by_user_id
            description: Who started the run.
          - name: status
            description: pending, running, completed, failed, awaiting_input, and so on.
          - name: requested_model
            description: The model the run asked for.
          - name: actual_route
            description: The model route that actually served it.
          - name: input_tokens
            description: Prompt tokens across the run.
          - name: output_tokens
            description: Completion tokens across the run.
          - name: cost_eur
            description: What the run cost, in EUR.
          - name: started_at
            description: When the run began.
          - name: completed_at
            description: When the run finished, or null while it is still going.
          - name: failure_code
            description: Why the run failed, when it did.
          - name: metadata
            description: JSON. Everything else recorded about the run.
          - name: awaiting_input_deadline
            description: When a run waiting on human input times out, where it is waiting.
          - name: report_definition_id
            description: The report definition this run was generating, where it was a report run.
          - name: reasoning_tokens
            description: Tokens spent on hidden reasoning, where the model reports them.

      - name: platform_conversations
        description: >
          Every conversation. `deleted_at` marks a soft delete rather than
          removing the row. `dt` is the UTC day of `updated_at`, so a conversation
          is re-extractable within its trailing window after its title changes or
          it is deleted.
        columns:
          - name: dt
            description: Partition date -- the UTC day `updated_at` falls on.
          - name: id
            description: The conversation's id.
          - name: owner_user_id
            description: Who owns the conversation.
          - name: team_id
            description: The team the conversation belongs to, where it belongs to one.
          - name: title
            description: The conversation's title.
          - name: agent_id
            description: Which agent this conversation runs against. Joins to platform_agents.
          - name: created_at
            description: When the conversation was started.
          - name: updated_at
            description: When the conversation last changed.
          - name: deleted_at
            description: When the conversation was soft-deleted, or null if it has not been.
          - name: reasoning_level
            description: The reasoning effort configured for this conversation.
          - name: origin
            description: How the conversation was started -- chat, schedule, automation, and so on.

      - name: platform_agents
        description: Every agent configured on the platform, snapshotted whole every day.
        columns:
          - name: dt
            description: Snapshot date -- the day this reading of the table was taken.
          - name: id
            description: The agent's id.
          - name: owner_user_id
            description: Who owns the agent.
          - name: team_id
            description: The team the agent belongs to, where it belongs to one.
          - name: name
            description: The agent's display name.
          - name: description
            description: The agent's own description of what it does.
          - name: status
            description: Whether the agent is active.
          - name: current_version
            description: The version number currently in effect.
          - name: created_at
            description: When the agent was created.
          - name: updated_at
            description: When the agent's configuration last changed.
          - name: template_id
            description: The template the agent was built from, where it was built from one.

      - name: platform_run_steps
        description: >
          Every step of every run: tool calls, reasoning steps, approvals asked
          for. The source for fct_agent_tool_call. High volume, and never passes
          through the LLM gateway -- litellm_spend does not see these. `dt` is the
          UTC day of `occurred_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `occurred_at` falls on.
          - name: id
            description: The step's id.
          - name: run_id
            description: The run this step belongs to. Joins to platform_runs.
          - name: sequence
            description: The step's position within its run.
          - name: type
            description: What kind of step this is -- tool_call, reasoning, approval_request, and so on.
          - name: title
            description: A short label for the step.
          - name: description
            description: A longer description of what the step did.
          - name: payload
            description: >
              JSON. The step's detail, shaped differently for each `type` -- for a
              tool_call this is expected to carry the tool name, arguments and
              result, but the exact key names are read defensively (a missing key
              lands as null rather than failing the model) because they are the
              application's own internal shape and not a documented contract.
          - name: occurred_at
            description: When the step happened.

      - name: platform_messages
        description: >
          Every message in every conversation, full text, by the owner's
          2026-09-14 decision -- see PLAN.md. `dt` is the UTC day of `created_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `created_at` falls on.
          - name: id
            description: The message's id.
          - name: conversation_id
            description: The conversation this message belongs to. Joins to platform_conversations.
          - name: author_user_id
            description: Who wrote the message, for a human-authored one. Null for the assistant's own messages.
          - name: run_id
            description: The run that produced this message, where one did.
          - name: role
            description: user, assistant, system, or tool.
          - name: content
            description: The message's full text.
          - name: metadata
            description: JSON. Everything else recorded about the message.
          - name: created_at
            description: When the message was written.

      - name: platform_email_sends
        description: >
          Every email the platform has sent or attempted to send. `dt` is the UTC
          day of `created_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `created_at` falls on.
          - name: id
            description: The send's id.
          - name: owner_user_id
            description: Who triggered the send.
          - name: run_id
            description: The run that triggered the send, where one did.
          - name: approval_id
            description: The approval that authorised the send, where one was required.
          - name: template_script_id
            description: The email template script used, where one was.
          - name: template_version
            description: Which version of that template.
          - name: subject
            description: The email's subject line.
          - name: recipients
            description: JSON. Who the email was sent to.
          - name: attachments
            description: JSON. What was attached, where anything was.
          - name: status
            description: sent, failed, or pending.
          - name: failure_reason
            description: Why the send failed, when it did.
          - name: created_at
            description: When the send was attempted.

      - name: platform_automation_runs
        description: >
          One row per run of an automation, from pending through its outcome. The
          source for fct_automation_run. `dt` is the UTC day of `created_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `created_at` falls on.
          - name: id
            description: The run's id.
          - name: automation_id
            description: Which automation this is a run of. Joins to platform_automations.
          - name: dagster_run_id
            description: The underlying Dagster run id, where the automation executes as one.
          - name: status
            description: pending, running, succeeded, failed.
          - name: started_at
            description: When the run began.
          - name: finished_at
            description: When the run ended, or null while still running.
          - name: created_at
            description: When the run record was created.

      - name: platform_automation_step_runs
        description: >
          One row per step of one automation run. `dt` is the UTC day of
          `started_at`.
        columns:
          - name: dt
            description: Partition date -- the UTC day `started_at` falls on.
          - name: id
            description: The step run's id.
          - name: automation_run_id
            description: The automation run this step belongs to. Joins to platform_automation_runs.
          - name: step_id
            description: Which configured step this is a run of.
          - name: dagster_run_id
            description: The underlying Dagster run id for this step, where applicable.
          - name: status
            description: pending, running, succeeded, failed, skipped.
          - name: outputs
            description: JSON. What the step produced, where it produced anything.
          - name: error
            description: The error the step raised, when it failed.
          - name: started_at
            description: When the step began.
          - name: finished_at
            description: When the step ended.
          - name: step_position
            description: The step's position within its automation.
          - name: step_type
            description: What kind of step this is.
          - name: step_label
            description: The step's display label.
          - name: step_config
            description: JSON. The step's own configuration, as run.

      - name: platform_automations
        description: Every configured automation, snapshotted whole every day.
        columns:
          - name: dt
            description: Snapshot date -- the day this reading of the table was taken.
          - name: id
            description: The automation's id.
          - name: owner_user_id
            description: Who owns the automation.
          - name: name
            description: The automation's display name.
          - name: description
            description: What the automation does, in the owner's own words.
          - name: enabled
            description: Whether the automation is switched on.
          - name: cadence_cron
            description: The cron expression the automation runs on.
          - name: timezone
            description: The timezone that cron expression is interpreted in.
          - name: created_by_approval_id
            description: The approval that authorised creating this automation, where one was required.
          - name: created_at
            description: When the automation was created.
          - name: updated_at
            description: When the automation's configuration last changed.
          - name: consecutive_failures
            description: How many times in a row the automation has failed.
          - name: paused_reason
            description: Why the automation is paused, where it is.
          - name: paused_at
            description: When it was paused.
          - name: last_error
            description: The most recent error the automation raised.

      - name: platform_users
        description: >
          Every platform user -- a handful of rows, this is a household's own
          platform, not a multi-tenant service -- snapshotted whole every day.
        columns:
          - name: dt
            description: Snapshot date -- the day this reading of the table was taken.
          - name: id
            description: The user's id.
          - name: keycloak_subject
            description: The matching Keycloak account's subject id.
          - name: username
            description: The user's login name.
          - name: display_name
            description: The user's display name.
          - name: email
            description: The user's email address.
          - name: status
            description: active, disabled, and so on.
          - name: litellm_end_user_id
            description: The matching end-user id in LiteLLM's own records, where there is one.
          - name: first_seen_at
            description: When the user first appeared on the platform.
          - name: last_seen_at
            description: When the user was last active.
          - name: last_login_at
            description: When the user last logged in.
          - name: created_at
            description: When the user's account was created.
          - name: updated_at
            description: When the user's record last changed.

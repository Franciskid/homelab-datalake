version: 2

sources:
  - name: raw
    description: >
      Parquet landed by Dagster, loaded into DuckDB by the warehouse_tables asset.
      Rebuilt in full from the lake on every run, so it cannot drift from object storage.
    schema: raw
    tables:
      - name: npm_access
        description: One row per HTTP request seen by an Nginx Proxy Manager instance.
      - name: npm_access_rejects
        description: >
          Lines no log format matched, kept with their raw text. Never dropped: the
          reject rate is a data-quality signal, and a silent drop would hide a format change.
      - name: litellm_spend
        description: >
          One row per LLM call from LiteLLM's spend ledger. Prompt and completion
          payloads are never selected; caller address, API key and end user are hashed
          at the ingestion boundary.
      - name: jellyfin_titles
        description: One row per movie per snapshot date. No paths, no playback history.
      - name: jellyfin_title_genres
        description: >
          Title-to-genre pairs. A separate table because a title has many genres and
          flattening them would mean a delimited string or genre_1/genre_2/genre_3.
      - name: camera_events
        description: >
          Attention events. Not final when first written: vision analysis lands hours
          later, so rows carry _extracted_at and the intermediate model keeps the
          newest version per event id.
      - name: camera_clips
        description: Clip metadata. No paths, playlists or thumbnails.
      - name: camera_logs
        description: Activity log entries. Free-text titles are never exported.
      - name: tmdb_titles
        description: >
          Budget, revenue, original language and vote counts from TMDB, keyed by the
          id Jellyfin already stored. A key lookup, never a title search, so a film
          cannot be enriched with another film's box office. Empty when no API key is
          configured -- enrichment is optional, exactly like geo.

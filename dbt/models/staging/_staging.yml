version: 2

models:
  - name: stg_tmdb_titles
    description: >
      The few TMDB figures Jellyfin has no field for, one row per id. Optional: empty
      when no API key is configured, which leaves budget, revenue, popularity, vote
      count and original language null. Everything else in the library marts -- the
      rating, the original title, the production country, the dates -- comes from the
      Jellyfin snapshot and is unaffected.
    columns:
      - name: tmdb_id
        description: >
          The join key into the library. Uniqueness is not cosmetic here -- it is what
          keeps the left join in fct_library_title from fanning out. A duplicate id
          would silently multiply every title count, runtime sum and rating average in
          the library marts, and nothing else in the build would notice.
        tests:
          - not_null
          - unique
      - name: vote_count
        description: >
          How many people rated it on TMDB. Kept while the average is not: the average
          is already in the library as community_rating, and the count is what says
          whether to trust it.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config: {where: "vote_count is not null"}
      - name: budget_usd
        description: >
          Null rather than 0 when TMDB has no figure. A film that cost nothing and a
          film nobody recorded a budget for are different rows.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              config: {where: "budget_usd is not null"}
      - name: revenue_usd
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              config: {where: "revenue_usd is not null"}

version: 2

models:
  - name: stg_npm_access
    description: >
      Requests, typed and cleaned, one row per line the parser accepted. Two judgement
      calls live here: `request_host` is kept exactly as the client sent it, because a
      scanner hitting a bogus Host is a fact worth counting; and `is_internal` reads the
      flag the privacy boundary set rather than re-deriving it, because the address is
      already gone.
    columns:
      - name: partition_date
        description: '{{ doc("req_partition_date") }}'
        tests: [not_null]
      - name: npm_instance
        description: '{{ doc("req_npm_instance") }}'
      - name: requested_at
        description: '{{ doc("req_requested_at") }}'
      - name: log_format
        description: '{{ doc("req_log_format") }}'
      - name: request_host
        description: '{{ doc("req_request_host") }}'
      - name: method
        description: '{{ doc("req_method") }}'
      - name: scheme
        description: '{{ doc("req_scheme") }}'
      - name: path
        description: '{{ doc("req_path") }}'
      - name: status
        description: '{{ doc("req_status") }}'
      - name: status_class
        description: '{{ doc("req_status_class") }}'
      - name: upstream_status
        description: '{{ doc("req_upstream_status") }}'
      - name: cache_status
        description: '{{ doc("req_cache_status") }}'
      - name: upstream_target
        description: '{{ doc("req_upstream_target") }}'
      - name: bytes_sent
        description: '{{ doc("req_bytes_sent") }}'
      - name: user_agent
        description: '{{ doc("req_user_agent") }}'
      - name: host_is_address
        description: '{{ doc("req_host_is_address") }}'
      - name: client_address
        description: '{{ doc("client_address") }}'
      - name: client_hash
        description: '{{ doc("client_hash") }}'
      - name: client_network
        description: '{{ doc("client_network") }}'
      - name: client_trust
        description: '{{ doc("client_trust") }}'
      - name: client_ip_version
        description: '{{ doc("client_ip_version") }}'
      - name: is_internal
        description: '{{ doc("client_is_internal") }}'
      - name: geo_country_code
        description: '{{ doc("geo_country_code") }}'
      - name: geo_country_name
        description: '{{ doc("geo_country_name") }}'
      - name: geo_city
        description: '{{ doc("geo_city") }}'
      - name: geo_asn
        description: '{{ doc("geo_asn") }}'
      - name: geo_as_org
        description: '{{ doc("geo_as_org") }}'
      - name: source_file
        description: '{{ doc("req_source_file") }}'

      - name: referer
        description: >
          The Referer header the client sent. Parsed from every line since this pipeline was
          written and then left out of the schema, so it was read and discarded on every line
          for a month. It is how a link somebody followed is told apart from a URL somebody
          typed.
      - name: gzip_ratio
        description: >
          nginx's compression ratio for the response. Null when the response was not
          compressed, which is a fact about the response rather than missing data.
      - name: has_query
        description: >
          Whether the request carried a query string. The string itself is still removed; this
          is what is left of the fact that there was one.
      - name: query_param_names
        description: >
          The parameter names the request carried, sorted and de-duplicated, never their
          values. Dropping the whole query string left 'which endpoints take a token
          parameter' unanswerable; each name is capped at 64 characters because a scanner can
          put a kilobyte of junk in one.
      - name: query_string
        description: '{{ doc("req_query_string") }}'
  - name: stg_camera_events
    description: >
      Camera events, typed. The export sends ISO-8601 strings; they are cast once here so
      nothing downstream has to guess the format or the zone. Still one row per *version*
      of an event -- the intermediate model is what reduces it to one row per event.
    columns:
      - name: partition_date
        description: '{{ doc("cam_partition_date") }}'
        tests: [not_null]
      - name: extracted_at
        description: '{{ doc("cam_extracted_at") }}'
      - name: event_id
        description: '{{ doc("cam_event_id") }}'
        tests: [not_null]
      - name: camera_id
        description: '{{ doc("cam_camera_id") }}'
      - name: zone_id
        description: '{{ doc("cam_zone_id") }}'
      - name: zone_name
        description: '{{ doc("cam_zone_name") }}'
      - name: rule_type
        description: '{{ doc("cam_rule_type") }}'
      - name: lifecycle
        description: '{{ doc("cam_lifecycle") }}'
      - name: started_at
        description: '{{ doc("cam_started_at") }}'
      - name: completed_at
        description: '{{ doc("cam_completed_at") }}'
      - name: state_observed_at
        description: >
          When the zone state was observed, in UTC. Null unless the event carries a
          state, which only state rules do.
      - name: clip_id
        description: '{{ doc("cam_clip_id") }}'
      - name: direction
        description: '{{ doc("cam_direction") }}'
      - name: zone_state
        description: '{{ doc("cam_zone_state") }}'
      - name: previous_zone_state
        description: '{{ doc("cam_previous_zone_state") }}'
      - name: confidence
        description: '{{ doc("cam_confidence") }}'
      - name: is_unusual
        description: '{{ doc("cam_is_unusual") }}'
      - name: should_notify
        description: '{{ doc("cam_should_notify") }}'
      - name: dismissal_reason
        description: '{{ doc("cam_dismissal_reason") }}'
      - name: duplicate_of
        description: '{{ doc("cam_duplicate_of") }}'
      - name: summary
        description: '{{ doc("cam_summary") }}'
      - name: is_confirmed
        description: '{{ doc("cam_is_confirmed") }}'
      - name: is_awaiting_analysis
        description: '{{ doc("cam_is_awaiting_analysis") }}'
      - name: duration_seconds
        description: '{{ doc("cam_duration_seconds") }}'

      - name: rule_id
        description: >
          The rule inside the zone that fired. Joins to dim_camera_zone; it landed in raw from
          the first partition and was never surfaced until now.
      - name: is_dismissed
        description: >
          Whether the camera marked the event dismissed outright, rather than it being
          inferred from lifecycle.
      - name: occurred_at
        description: >
          When the event actually happened, which a replay or a repair moves away from
          started_at. Null when the camera never recorded one.
      - name: happened_at
        description: >
          The instant to rank an event by: occurred_at when the camera knows it, started_at
          otherwise. Resolved once, here, because the camera's own report does the same
          fallback and anything that wants to agree with it must too.
      - name: state_source
        description: >
          How a state reading was arrived at, where the camera recorded something other than
          the ordinary analysis path.
      - name: count_person
        description: >
          How many people the event counted. Null means nothing was counted, which is not the
          same as zero: an event nobody counted is not an event that counted nobody.
      - name: count_vehicle
        description: >
          How many vehicles the event counted. Null and zero are different, as for
          count_person.
      - name: count_animal
        description: >
          How many animals the event counted. Null and zero are different, as for
          count_person.
      - name: count_other
        description: >
          How many other subjects the event counted. Null and zero are different, as for
          count_person.
      - name: count_total
        description: >
          The four subject counts added together, or null when nothing was counted. Every
          graph of this data is a sum over these -- summing four columns by hand is how a
          headline comes to disagree with the rows beneath it.
      - name: was_corrected
        description: >
          Whether a person overwrote what the machine concluded about this event. Without it a
          corrected figure is indistinguishable from one nobody touched.
      - name: corrected_at
        description: >
          When the correction was made.
      - name: corrected_by_name
        description: >
          Who made the correction. The name travels because a pseudonym does not answer 'who
          overrode this'.
      - name: corrected_by_hash
        description: >
          Salted hash of the person who made the correction, for grouping without naming.
      - name: machine_lifecycle
        description: >
          What the machine originally concluded the lifecycle was, before a person changed it.
      - name: machine_direction
        description: >
          The direction the machine originally reported.
      - name: machine_zone_state
        description: >
          The state the machine originally reported.
      - name: machine_previous_zone_state
        description: >
          The previous state the machine originally reported.
      - name: machine_state_observed_at
        description: >
          When the machine originally said the state was observed.
      - name: machine_dismissal_reason
        description: >
          The dismissal reason the machine originally gave.
      - name: machine_duplicate_of
        description: >
          The event the machine originally thought this duplicated.
      - name: machine_summary
        description: >
          The description the machine originally wrote.
      - name: machine_confidence
        description: >
          The confidence the machine originally reported. Comparing it against a correction is
          how 'is the model overconfident when it is wrong' becomes answerable.
      - name: machine_should_notify
        description: >
          Whether the machine originally decided to notify.
      - name: machine_count_person
        description: >
          How many people the machine originally counted.
      - name: machine_count_vehicle
        description: >
          How many vehicles the machine originally counted.
      - name: machine_count_animal
        description: >
          How many animals the machine originally counted.
      - name: machine_count_other
        description: >
          How many other subjects the machine originally counted.
      - name: transition_clip_id
        description: >
          The clip that filmed the gate moving. For a state change clip_id shows a gate that
          has already finished moving, so a reader wanting the transition wants this one.
      - name: backfill_json
        description: >
          JSON. Present when the row was written by a backfill rather than the live path.
      - name: repair_json
        description: >
          JSON. Present when the row was reconstructed by a repair, naming the incident.
      - name: restoration_json
        description: >
          JSON. Present when the row was restored from a backup.
      - name: timing_correction_json
        description: >
          JSON. Present when the event's own timestamps were corrected, with the previous
          values and the evidence.
      - name: unmapped_json
        description: >
          JSON, or null. Anything the export sent that the raw schema does not name. Carried
          onto the fact rather than left in raw, because the person who notices it is the one
          looking at the data.
  - name: stg_litellm_spend
    description: >
      Calls with the workload, provider and self-hosted flags resolved. `spend_usd` is
      LiteLLM's own figure and is never recomputed: carrying a second copy of every
      model's price list would drift from the proxy's and then quietly disagree with the
      bill.
    columns:
      - name: partition_date
        description: '{{ doc("llm_partition_date") }}'
        tests: [not_null]
      - name: request_id
        description: LiteLLM's identifier for the call, and the key the fact table uses.
        tests: [not_null, unique]
      - name: session_id
        description: '{{ doc("llm_session_id") }}'
      - name: started_at
        description: '{{ doc("llm_started_at") }}'
      - name: ended_at
        description: When the response completed, in UTC.
      - name: first_token_at
        description: >
          When the first token of the completion arrived, in UTC. Null for a call that
          streamed nothing.
      - name: call_type
        description: '{{ doc("llm_call_type") }}'
      - name: model
        description: '{{ doc("llm_model") }}'
      - name: model_group
        description: '{{ doc("llm_model_group") }}'
      - name: provider
        description: '{{ doc("llm_provider") }}'
      - name: mcp_tool
        description: '{{ doc("llm_mcp_tool") }}'
      - name: status
        description: '{{ doc("llm_status") }}'
      - name: spend_usd
        description: '{{ doc("llm_spend_usd") }}'
      - name: total_tokens
        description: '{{ doc("llm_total_tokens") }}'
      - name: prompt_tokens
        description: '{{ doc("llm_prompt_tokens") }}'
      - name: completion_tokens
        description: '{{ doc("llm_completion_tokens") }}'
      - name: duration_ms
        description: '{{ doc("llm_duration_ms") }}'
      - name: time_to_first_token_ms
        description: '{{ doc("llm_ttft_ms") }}'
      - name: was_cache_hit
        description: '{{ doc("llm_was_cache_hit") }}'
      - name: workload
        description: '{{ doc("llm_workload") }}'
      - name: is_self_hosted
        description: '{{ doc("llm_is_self_hosted") }}'
      - name: team_id
        description: '{{ doc("llm_team_id") }}'
      - name: end_user_hash
        description: '{{ doc("llm_end_user_hash") }}'
      - name: api_key_hash
        description: '{{ doc("llm_api_key_hash") }}'
      - name: client_hash
        description: '{{ doc("client_hash") }}'
      - name: client_network
        description: '{{ doc("client_network") }}'
      - name: client_trust
        description: '{{ doc("client_trust") }}'
      - name: geo_country_code
        description: '{{ doc("geo_country_code") }}'
      - name: geo_asn
        description: '{{ doc("geo_asn") }}'
      - name: geo_as_org
        description: '{{ doc("geo_as_org") }}'

      - name: model_id
        description: >
          The specific deployment of the model that served the call, where the group has
          several.
      - name: api_base
        description: >
          Which upstream endpoint the call went to. Says whether a model was served locally or
          by a provider.
      - name: cache_key
        description: >
          The key the proxy cached the response under. Two calls sharing one asked the same
          question.
      - name: organization_id
        description: >
          The organisation the call was billed to. Empty on this deployment today.
      - name: agent_id
        description: >
          The agent that made the call, where one did. Empty on this deployment today.
      - name: user_hash
        description: >
          Salted hash of LiteLLM's own end-user label, which is distinct from end_user.
      - name: request_tags
        description: >
          The tags the caller attached to the request.
      - name: cached_tokens
        description: >
          Prompt tokens served from the provider's cache. Null when not reported, which is not
          zero: total_tokens cannot tell a cached prompt from a fresh one, so a cost-per-token
          figure from it alone was wrong.
      - name: prompt_audio_tokens
        description: >
          Audio tokens in the prompt. Null when not reported.
      - name: reasoning_tokens
        description: >
          Tokens spent on hidden reasoning. Counted inside completion_tokens, so it explains a
          call that looks expensive for the answer it produced. Null when not reported.
      - name: completion_audio_tokens
        description: >
          Audio tokens in the completion. Null when not reported.
      - name: accepted_prediction_tokens
        description: >
          Predicted-output tokens the model accepted.
      - name: rejected_prediction_tokens
        description: >
          Predicted-output tokens the model rejected.
      - name: input_cost_usd
        description: >
          What the prompt cost, separately from the answer. spend_usd is the two added
          together, which could not answer the first question anybody asks of an LLM bill.
      - name: output_cost_usd
        description: >
          What the completion cost.
      - name: tool_usage_cost_usd
        description: >
          What tool calls within the request cost, where any were charged.
      - name: original_cost_usd
        description: >
          The cost before any discount or margin.
      - name: discount_amount_usd
        description: >
          How much was discounted from the original cost.
      - name: attempted_retries
        description: >
          How many times the proxy retried before this call succeeded or gave up. A rising
          figure is an upstream in trouble.
      - name: max_retries
        description: >
          How many retries the proxy was willing to make.
      - name: litellm_overhead_ms
        description: >
          How long the proxy itself took, as distinct from the model. Separates 'the model was
          slow' from 'the gateway was'.
      - name: applied_guardrails
        description: >
          Which guardrails ran on the call.
      - name: api_key_alias
        description: >
          The human-readable name of the key that made the call. The key itself is hashed;
          this is what a person recognises.
      - name: team_alias
        description: >
          The human-readable name of the team the call was billed to.
      - name: model_map_key
        description: >
          The entry in the proxy's model map that resolved the request. Says which alias a
          caller actually asked for.
      - name: error_information
        description: >
          JSON. Why a call failed, when one did.
      - name: metadata_json
        description: >
          JSON. LiteLLM's metadata blob, whole. The extracted scalars beside it are a
          convenience over it, not a filter on it.
      - name: requester_ip
        description: >
          The caller's address as the ledger recorded it, beside the hashed and geo columns.
          Internal container addresses on this deployment -- a fact about one's own
          infrastructure, unlike the proxy logs where addresses belong to visitors and stay
          hashed.
      - name: messages_json
        description: >
          JSON. The full prompt sent to the model. Empty on every row today because payload
          logging is off; once it is on, every conversation through the gateway lands here and
          is readable by anything that can read the lake.
      - name: response_json
        description: >
          JSON. The model's full completion. Empty today, for the same reason as
          messages_json.
      - name: proxy_server_request_json
        description: >
          JSON. The raw request the proxy received. Empty today, for the same reason as
          messages_json.
  - name: stg_jellyfin_titles
    description: >
      Titles, typed, with decade and resolution class derived. One row per title per
      snapshot date -- the same film appears once for every day it sat on the disk, which
      is what makes SCD2 history possible and what makes summing across dates wrong.
    columns:
      - name: snapshot_date
        description: '{{ doc("lib_snapshot_date") }}'
        tests: [not_null]
      - name: item_id
        description: '{{ doc("lib_item_id") }}'
        tests: [not_null]
      - name: title
        description: '{{ doc("lib_title") }}'
      - name: original_title
        description: '{{ doc("lib_original_title") }}'
      - name: production_year
        description: '{{ doc("lib_production_year") }}'
      - name: decade
        description: '{{ doc("lib_decade") }}'
      - name: premiere_date
        description: '{{ doc("lib_premiere_date") }}'
      - name: added_at
        description: '{{ doc("lib_added_at") }}'
      - name: community_rating
        description: '{{ doc("lib_community_rating") }}'
      - name: critic_rating
        description: '{{ doc("lib_critic_rating") }}'
      - name: official_rating
        description: '{{ doc("lib_official_rating") }}'
      - name: runtime_minutes
        description: '{{ doc("lib_runtime_minutes") }}'
      - name: is_runtime_plausible
        description: '{{ doc("lib_is_runtime_plausible") }}'
      - name: is_long_feature
        description: '{{ doc("lib_is_long_feature") }}'
      - name: container
        description: '{{ doc("lib_container") }}'
      - name: video_codec
        description: '{{ doc("lib_video_codec") }}'
      - name: video_height
        description: '{{ doc("lib_video_height") }}'
      - name: video_width
        description: '{{ doc("lib_video_width") }}'
      - name: video_bit_depth
        description: >
          Bits per colour channel of the primary video stream. The evidence behind
          `is_high_bit_depth`, kept because "how much of the library is 10-bit" and "is
          this file HDR" are different questions.
      - name: is_high_bit_depth
        description: '{{ doc("lib_is_high_bit_depth") }}'
      - name: resolution_class
        description: '{{ doc("lib_resolution_class") }}'
      - name: audio_codec
        description: '{{ doc("lib_audio_codec") }}'
      - name: audio_channels
        description: '{{ doc("lib_audio_channels") }}'
      - name: studio
        description: '{{ doc("lib_studio") }}'
      - name: production_country
        description: '{{ doc("lib_production_country") }}'
      - name: tmdb_id
        description: '{{ doc("lib_tmdb_id") }}'
      - name: imdb_id
        description: '{{ doc("lib_imdb_id") }}'

      - name: tmdb_collection_id
        description: >
          The franchise the film belongs to, as TMDB numbers them. Two films sharing this are
          episodes of one series, which no other column here says.
      - name: tvdb_id
        description: >
          The film's TVDB id, where Jellyfin matched one.
      - name: studios
        description: >
          Every studio credited, in the order the API gave them. `studio` is the first of
          these; one title here has twenty-five, and keeping only the first described a co-
          production as the work of one company.
      - name: production_countries
        description: >
          Every production country, primary first. `production_country` is the first of these.
      - name: sort_name
        description: >
          The name the library sorts by, which drops leading articles.
      - name: overview
        description: >
          The film's synopsis. Held back originally as prose no question asked about, which
          was true until somebody asked one.
      - name: tagline
        description: >
          The film's marketing line, first only. The full list is in taglines.
      - name: taglines
        description: >
          Every tagline the library holds for the film.
      - name: tags
        description: >
          Free-form tags applied to the title in the library.
      - name: parent_id
        description: >
          The library folder the title sits in.
      - name: item_type
        description: >
          Jellyfin's own type for the row. Always Movie for this snapshot, kept so that stays
          checkable.
      - name: media_type
        description: >
          The kind of media -- Video for everything in this library.
      - name: video_type
        description: >
          How the video is stored -- a single file, a disc image, a folder.
      - name: has_subtitles
        description: >
          Whether the library believes the title has subtitles at all. The detail is in
          stg_jellyfin_title_streams.
      - name: subtitle_languages
        description: >
          Distinct subtitle languages across the title's streams, sorted. Derived at ingest so
          'what can I watch in French' does not need the stream table.
      - name: audio_languages
        description: >
          Distinct audio languages across the title's streams, sorted.
      - name: stream_count
        description: >
          How many media streams the title has in total.
      - name: chapter_count
        description: >
          How many chapter markers the file carries.
      - name: remote_trailer_count
        description: >
          How many trailers the library knows about.
      - name: external_urls
        description: >
          The film's pages on public databases, as name and url pairs.
      - name: file_size_bytes
        description: >
          Size of the primary media file -- the figure a library-growth question needs.
      - name: file_bitrate
        description: >
          Overall bitrate of the primary media file.
      - name: media_source_count
        description: >
          How many media sources the title has. More than one means several versions of the
          same film.
      - name: unmapped_json
        description: >
          JSON, or null. Anything Jellyfin returned that nothing here reads. Fields
          deliberately not stored are excluded, so a value here is always a prompt to add a
          column.
  - name: stg_jellyfin_title_genres
    description: >
      Title-to-genre pairs, trimmed and deduplicated. Blank genres are dropped here
      rather than downstream, so nothing has to filter for an empty string.
    columns:
      - name: snapshot_date
        description: '{{ doc("lib_snapshot_date") }}'
        tests: [not_null]
      - name: item_id
        description: '{{ doc("lib_item_id") }}'
        tests: [not_null]
      - name: genre
        description: '{{ doc("lib_genre") }}'
        tests: [not_null]

  - name: stg_jellyfin_playback
    description: >
      Playback sessions, typed. `started_at` and `play_duration_seconds` are already
      correct here, not derived -- the raw asset converted the plugin's naive SQLite
      timestamp to UTC and its PlayDuration to whole seconds at ingest, both verified
      against real sessions on this server rather than assumed.
    columns:
      - name: partition_date
        description: '{{ doc("pb_partition_date") }}'
        tests: [not_null]
      - name: partition_hour
        description: '{{ doc("pb_partition_hour") }}'
        tests: [not_null]
      - name: extracted_at
        description: '{{ doc("pb_extracted_at") }}'
        tests: [not_null]
      - name: started_at
        description: '{{ doc("pb_started_at") }}'
        tests: [not_null]
      - name: user_id
        description: '{{ doc("pb_user_id") }}'
      - name: user_name
        description: '{{ doc("pb_user_name") }}'
      - name: item_id
        description: '{{ doc("pb_item_id") }}'
        tests: [not_null]
      - name: item_type
        description: '{{ doc("pb_item_type") }}'
      - name: item_name
        description: '{{ doc("pb_item_name") }}'
      - name: series_name
        description: '{{ doc("pb_series_name") }}'
      - name: playback_method
        description: '{{ doc("pb_playback_method") }}'
      - name: client_name
        description: '{{ doc("pb_client_name") }}'
      - name: device_name
        description: '{{ doc("pb_device_name") }}'
      - name: play_duration_seconds
        description: '{{ doc("pb_play_duration_seconds") }}'
      - name: is_episode
        description: '{{ doc("pb_is_episode") }}'

  - name: stg_jellyfin_activity
    description: >
      Server activity log entries, typed. One row per sign-in, playback start or
      stop, and library or account change -- whatever Jellyfin itself decided to log.
    columns:
      - name: partition_date
        description: '{{ doc("act_partition_date") }}'
        tests: [not_null]
      - name: extracted_at
        description: '{{ doc("act_extracted_at") }}'
        tests: [not_null]
      - name: activity_id
        description: '{{ doc("act_activity_id") }}'
        tests: [not_null, unique]
      - name: happened_at

  - name: stg_tmdb_titles
    description: >
      The few TMDB figures Jellyfin has no field for, one row per id. Optional: empty
      when no API key is configured, which leaves budget, revenue, popularity, vote
      count and original language null. Everything else in the library marts -- the
      rating, the original title, the production country, the dates -- comes from the
      Jellyfin snapshot and is unaffected.
    columns:
      - name: tmdb_id
        description: >
          The join key into the library. Uniqueness is not cosmetic here -- it is what
          keeps the left join in fct_library_title from fanning out. A duplicate id
          would silently multiply every title count, runtime sum and rating average in
          the library marts, and nothing else in the build would notice.
        tests:
          - not_null
          - unique
      - name: enriched_at
        description: >
          When this pipeline last asked TMDB about this id. Not a snapshot date and not
          an event time: this table is a lookup cache of facts that change on TMDB's
          schedule, and this records when it was refreshed.
      - name: original_language
        description: '{{ doc("lib_original_language") }}'
      - name: vote_count
        description: >
          How many people rated it on TMDB. Kept while the average is not: the average
          is already in the library as community_rating, and the count is what says
          whether to trust it.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config: {where: "vote_count is not null"}
      - name: popularity
        description: >
          TMDB's own popularity score. Relative and time-varying, so it ranks titles
          against each other and means nothing as an absolute figure.
      - name: budget_usd
        description: >
          Null rather than 0 when TMDB has no figure. A film that cost nothing and a
          film nobody recorded a budget for are different rows.
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              config: {where: "budget_usd is not null"}
      - name: revenue_usd
        description: '{{ doc("lib_revenue_usd") }}'
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              config: {where: "revenue_usd is not null"}
      - name: revenue_to_budget
        description: '{{ doc("lib_revenue_to_budget") }}'

      - name: vote_average
        description: >
          TMDB's rating out of ten. Jellyfin holds a copy as community_rating, taken when it
          scanned the file, which can be years stale. Both are kept, each named for where it
          came from, because with only one there was no way to see the copy had drifted.
      - name: tmdb_runtime_minutes
        description: >
          TMDB's runtime. Comparable against the library's own, which is measured from the
          file.
      - name: release_status
        description: >
          Released, Post Production, Planned. A library title with a non-released status is
          usually a mismatched id.
      - name: tmdb_tagline
        description: >
          The film's marketing line as TMDB holds it.
      - name: tmdb_overview
        description: >
          TMDB's synopsis. Comparable against the library's, which may be localised.
      - name: homepage
        description: >
          The film's official site, where TMDB has one.
      - name: tmdb_release_date
        description: >
          TMDB's release date. The library's premiere_date is the same fact from its own scan.
      - name: tmdb_imdb_id
        description: >
          The film's IMDb id as TMDB holds it -- a second opinion on the library's own.
      - name: tmdb_original_title
        description: >
          The title as released, before any localisation.
      - name: tmdb_title
        description: >
          TMDB's primary title, usually the English one.
      - name: is_adult
        description: >
          Whether TMDB flags the film as adult.
      - name: collection_id
        description: >
          The franchise the film belongs to. Two films sharing this are episodes of one
          series.
      - name: collection_name
        description: >
          The franchise's name, for reading rather than joining.
      - name: tmdb_genres
        description: >
          TMDB's genres -- a second opinion on the library's own genre list.
      - name: production_companies
        description: >
          Every company credited with producing the film.
      - name: tmdb_production_countries
        description: >
          Every country the film was produced in, as TMDB records them.
      - name: spoken_languages
        description: >
          The languages spoken in the film. Distinct from audio_languages, which is what
          tracks the file happens to carry.
      - name: origin_countries
        description: >
          The country codes the film originates from.
  - name: stg_camera_clips
    description: >
      Clip metadata, typed. This model did not exist: [count withheld] clips had been landing in the raw
      layer fully documented since the pipeline was written, and nothing read them -- so an
      event could not reach the footage that filmed it.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: unmapped_json
        description: >
          JSON, or null. Any field the export sent that the raw schema does not name, kept
          rather than dropped. Non-null is a prompt to give the field a column -- the signal
          whose absence lost `counts` on every event for a month.
      - name: clip_id
        description: >
          The clip's stable id. What `fct_camera_event.clip_id` points at; every one of them
          resolves.
        tests: [not_null, unique]
      - name: clip_kind
        description: >
          What caused the recording -- `attention` for an analysed event, `manual` for one
          somebody saved.
      - name: clip_title
        description: >
          The clip's label, such as "1 personne". Generated from what the analysis found
          rather than prose anybody typed, and it is the caption the app itself shows.
      - name: created_at
        description: >
          When the recording started.
      - name: saved_at
        description: >
          When it finished being written out. Later than created_at by however long the encode
          took.
      - name: save_latency_seconds
        description: >
          How long the clip took to be written after it began. A rising figure is the recorder
          falling behind, which nothing else in the warehouse would show.
      - name: duration_seconds
        description: >
          How long the clip runs, parsed from the display string the store keeps.
      - name: size_bytes
        description: >
          Size on disk, parsed from the display string.
      - name: bytes_per_second
        description: >
          Size over duration. Null when either is missing or zero. A sudden change means the
          encoder settings moved.
      - name: segment_count
        description: >
          How many HLS segments the clip is made of.
      - name: storage_quality
        description: >
          The rendition kept -- 240p for a routine attention clip, higher for one somebody
          saved.
      - name: is_archived
        description: >
          Whether the clip has been moved to the archive rather than the live history.
      - name: is_deleted
        description: >
          Whether the clip has been deleted. Kept as a row so a deletion is visible rather
          than a gap.
      - name: ai_source
        description: >
          Which detector raised it -- `opencv` for local motion, or the vision model.
      - name: ai_type
        description: >
          What that detector thought it saw.
      - name: local_confidence
        description: >
          The local detector's own score. Not the same number as the event's `confidence`,
          which is the vision model's; two different judgements about one moment, named apart.
      - name: created_by_hash
        description: >
          Salted hash of whoever saved the clip by hand. Null for one the system recorded on
          its own.
      - name: annotation_count
        description: >
          How many notes were left on the clip. Zero, never null.

  - name: stg_camera_logs
    description: >
      Camera activity log entries, typed. The record of what a person did, as opposed to what
      the cameras saw. [count withheld] entries had no model reading them.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: unmapped_json
        description: >
          JSON, or null. Any field the export sent that the raw schema does not name, kept
          rather than dropped. Non-null is a prompt to give the field a column -- the signal
          whose absence lost `counts` on every event for a month.
      - name: log_id
        description: >
          The entry's stable id.
        tests: [not_null]
      - name: entry_type
        description: >
          What happened -- a comment, a manual recording, a detection pause.
      - name: is_important
        description: >
          Whether the entry was flagged as important when it was written.
      - name: created_at
        description: >
          When the entry was written.
      - name: entry_title
        description: >
          The entry's free text, as the person wrote it, @mentions and all. Landed at the
          owner's request; expect the names of people in their household in it.
      - name: source_id
        description: >
          The clip or event the entry was written against. What makes the log joinable rather
          than a flat feed.
      - name: user_hash
        description: >
          Salted hash of the person who caused the entry. Null for anything the system did on
          its own.
      - name: was_written_by_a_person
        description: >
          Whether a person caused this entry, as opposed to the system recording it. Derived
          from user_hash being present.

  - name: stg_camera_zones
    description: >
      Zone and rule configuration, one row per rule per day. The reference table the event
      stream never had: without it the only clue that a zone is a gate is that its events
      happen to carry rule_type 'state', which is inference from the data rather than a fact
      about the configuration.
    columns:
      - name: snapshot_date
        description: >
          The day this configuration was observed. Not backfillable: the camera keeps no
          history for a zone, so an older date would describe events by rules that did not
          exist when they fired.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: zone_id
        description: >
          The zone's stable id. What `fct_camera_event.zone_id` points at.
        tests: [not_null]
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: zone_name
        description: >
          The zone's display name -- Portail, Animaux.
      - name: zone_description
        description: >
          The free-text note describing what the zone is for.
      - name: zone_scope
        description: >
          Whether the zone covers drawn shapes or the whole frame.
      - name: is_enabled
        description: >
          Whether the zone is switched on. A disabled zone fires nothing.
      - name: zone_revision
        description: >
          How many times the zone has been edited. Two snapshots sharing it are the same
          configuration.
      - name: geometry_revision
        description: >
          How many times the shapes have moved, separately from the rules. A bump here can
          explain a step change in event counts that no rule change would account for.
      - name: anchor_count
        description: >
          How many calibration anchors the zone holds. Zero means it has never been
          calibrated, which is the usual reason its state readings are unreliable.
      - name: state_reference_count
        description: >
          How many reference samples the zone judges open-versus-closed against.
      - name: revision_count
        description: >
          How many past configurations the zone keeps.
      - name: feedback_count
        description: >
          How many times a person has corrected what this zone concluded. A zone with a lot of
          feedback is one the model keeps getting wrong, which no count of events would show.
      - name: does_auto_learn_anchors
        description: >
          Whether the zone re-learns its calibration on its own.
      - name: max_anchors
        description: >
          How many anchors the zone is allowed to keep.
      - name: created_at
        description: >
          When the zone was created.
      - name: created_by_hash
        description: >
          Salted hash of whoever created it.
      - name: created_by_name
        description: >
          The name of whoever created it. The name travels beside the hash here for the same
          reason it does on a correction: who configured this is not answered by a pseudonym.
      - name: updated_at
        description: >
          When the zone was last edited.
      - name: updated_by_hash
        description: >
          Salted hash of whoever last edited it.
      - name: updated_by_name
        description: >
          The name of whoever last edited it.
      - name: rule_id
        description: >
          The rule's id within the zone. What `fct_camera_event.rule_id` points at. Null on a
          zone with no rules, which still appears rather than vanishing.
      - name: rule_type
        description: >
          What the rule watches -- `state` for a gate, `crossing` for passages, `motion` for
          activity.
      - name: rule_name
        description: >
          The rule's display name.
      - name: is_rule_enabled
        description: >
          Whether the rule is switched on, independently of the zone.
      - name: does_rule_notify
        description: >
          Whether a match notifies, as opposed to only being recorded.
      - name: rule_cooldown_seconds
        description: >
          How long the rule waits before firing again. A long cooldown is a reason a busy
          period shows fewer events than it had activity.
      - name: rule_sensitivity
        description: >
          The sensitivity band the rule runs at.
      - name: rule_prompt
        description: >
          The analysis prompt the vision model is given. The only record of why a rule fires
          as it does.
      - name: rule_targets
        description: >
          Which subjects the rule looks for.
      - name: rule_states
        description: >
          The states a state rule may report.
      - name: rule_alert_on
        description: >
          Which transitions raise an alert rather than being recorded quietly.
      - name: shapes_json
        description: >
          JSON. The zone's polygons in normalised frame coordinates -- a map of where each
          watched region physically sits. Landed at the owner's explicit request; the counts
          above answer most questions without parsing it.
      - name: ignore_shapes_json
        description: >
          JSON. Regions inside the zone deliberately excluded from analysis.
      - name: anchors_json
        description: >
          JSON. The calibration anchors themselves.
      - name: state_references_json
        description: >
          JSON. The reference samples used to decide open versus closed.
      - name: anchor_policy_json
        description: >
          JSON. Whether the zone re-learns anchors, and how many it may keep.
      - name: revisions_json
        description: >
          JSON. Every past configuration, with the instant and the snapshot. How a step change
          in event counts is traced to the edit that caused it.
      - name: feedback_json
        description: >
          JSON. Every correction a person has made to what this zone concluded.
      - name: unmapped_json
        description: >
          JSON, or null. Any field the export sent that the raw schema does not name, kept
          rather than dropped. Non-null is a prompt to give the field a column -- the signal
          whose absence lost `counts` on every event for a month.
      - name: is_gate_rule
        description: >
          Whether this rule watches a gate, derived from rule_type. The question `rule_type =
          'state'` was standing in for before this table existed.
      - name: has_rule
        description: >
          Whether the zone has any rule configured at all.

  - name: stg_camera_observability
    description: >
      Spans where a zone could not be read, typed. The other half of every gate reading: with
      state events alone there is no way to tell a gate that stayed shut from a gate nobody
      could see.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: unmapped_json
        description: >
          JSON, or null. Any field the export sent that the raw schema does not name, kept
          rather than dropped. Non-null is a prompt to give the field a column -- the signal
          whose absence lost `counts` on every event for a month.
      - name: span_id
        description: >
          Stable id for the span, built from the zone and the instant it began, so re-reading
          a window merges rather than duplicating.
        tests: [not_null]
      - name: zone_id
        description: >
          The zone that could not be read. Joins to dim_camera_zone.
      - name: reason
        description: >
          Why it was unreadable. `night_blind` is darkness; `out_of_view` and `lost` are the
          tracker losing the region; `state_unconfirmed` is the freshness lease expiring
          rather than the picture going away.
      - name: detail
        description: >
          Any extra explanation the camera recorded alongside the reason.
      - name: from_at
        description: >
          When the span began.
      - name: to_at
        description: >
          When it ended, or the end of the window asked for when it had not. Read with
          is_ongoing.
      - name: is_ongoing
        description: >
          Whether the span was still open at the end of the window. True means to_at is where
          the question stopped, not where the blindness did.
      - name: duration_seconds
        description: >
          How long the zone was unreadable.
      - name: is_lease_expiry
        description: >
          Whether this is the freshness lease expiring rather than a camera that could not
          see. A timing artefact, and it must not be counted as vision loss.
      - name: is_vision_loss
        description: >
          Whether the camera genuinely could not see -- darkness, the region out of view, an
          unreadable picture.

  - name: stg_camera_annotations
    description: >
      Notes and marks left against a clip or an event, typed.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: unmapped_json
        description: >
          JSON, or null. Any field the export sent that the raw schema does not name, kept
          rather than dropped. Non-null is a prompt to give the field a column -- the signal
          whose absence lost `counts` on every event for a month.
      - name: annotation_id
        description: >
          The annotation's stable id.
        tests: [not_null]
      - name: scope
        description: >
          Which kind of thing target_id points at -- `clip` or `live`. A reader joining
          without checking it would match a clip id against a camera id.
      - name: target_id
        description: >
          The clip or camera the note was left on. Read with scope.
      - name: annotation_kind
        description: >
          What kind of mark it is -- a note, an event marker, a reaction.
      - name: emoji
        description: >
          The icon chosen for the mark.
      - name: offset_seconds
        description: >
          How far into the clip the mark sits. Null for a live mark.
      - name: timestamp_ms
        description: >
          The wall-clock instant the mark refers to, in epoch milliseconds.
      - name: created_at
        description: >
          When the annotation was written.
      - name: note_text
        description: >
          The note itself, as written. Landed for the same reason the log title is.
      - name: user_hash
        description: >
          Salted hash of whoever wrote it. Null for anything the system wrote on its own.
      - name: zone_id
        description: >
          The zone the mark relates to, when it came from zone analysis.
      - name: rule_id
        description: >
          The rule the mark relates to, when it came from zone analysis.
      - name: event_type
        description: >
          The kind of event the mark was raised for.
      - name: targets_a_clip
        description: >
          Whether target_id is a clip id. Derived from scope so a join does not have to re-
          derive it.
      - name: targets_a_camera
        description: >
          Whether target_id is a camera id.
      - name: was_written_by_a_person
        description: >
          Whether a person wrote it, as opposed to the system marking its own analysis.
  - name: stg_jellyfin_title_people
    description: >
      Cast and crew credits, one row per person per title. Public film metadata, not anything
      about anybody using this library.
    columns:
      - name: snapshot_date
        description: >
          The day of the snapshot this credit was seen in.
      - name: item_id
        description: >
          The title the credit belongs to.
      - name: person_id
        description: >
          Jellyfin's stable id for the person, so the same actor matches across films.
      - name: person_name
        description: >
          The person's name as the library holds it.
      - name: person_type
        description: >
          What they did -- Actor, Director, Writer, Producer.
      - name: role
        description: >
          The character an actor played. Null for crew.
      - name: sort_order
        description: >
          Where the credit sits in the billing order, zero-based.
      - name: is_cast
        description: >
          Whether this is an acting credit rather than a crew one.
      - name: is_top_billed
        description: >
          Whether the credit is in the first five. The distinction between a lead and a walk-
          on, which is why the order is kept rather than the set of names alone.
  - name: stg_jellyfin_title_streams
    description: >
      Media streams, typed. One row per audio, video or subtitle track. Keeping the first
      video and first audio stream lost every subtitle track in the library and every audio
      track after the first.
    columns:
      - name: snapshot_date
        description: >
          The day of the snapshot this stream was seen in.
      - name: item_id
        description: >
          The title the stream belongs to.
      - name: stream_index
        description: >
          The stream's position in the file. Unique within a title, and half of the natural
          key.
      - name: stream_type
        description: >
          Video, Audio, Subtitle, or EmbeddedImage.
      - name: codec
        description: >
          How the stream is encoded -- h264, ac3, subrip.
      - name: language
        description: >
          The stream's language as a three-letter code. Null when the file does not declare
          one.
      - name: stream_title
        description: >
          The label the file gives the stream -- "VFF 5.1 @384Kbps".
      - name: display_title
        description: >
          Jellyfin's own rendering of the stream -- "1080p H264 SDR". Worth keeping beside the
          derived resolution class, which disagrees with it on cropped encodes: a 1080p film
          letterboxed to [count withheld] rows is called 720p by the band table and 1080p here.
      - name: is_default
        description: >
          Whether this is the track that plays without the viewer choosing.
      - name: is_forced
        description: >
          Whether the track is forced -- shown even when subtitles are off.
      - name: is_external
        description: >
          Whether the stream is a separate file rather than embedded in the container.
      - name: is_hearing_impaired
        description: >
          Whether the subtitle track is marked as for the hearing impaired.
      - name: is_interlaced
        description: >
          Whether the video is interlaced.
      - name: height
        description: >
          Picture height in pixels. Null on a subtitle stream, which reports zero.
      - name: width
        description: >
          Picture width in pixels.
      - name: channels
        description: >
          How many audio channels. 6 for 5.1, 2 for stereo.
      - name: channel_layout
        description: >
          How those channels are arranged, as the encoder named it.
      - name: bit_rate
        description: >
          The stream's bitrate, where the container declares one.
      - name: bit_depth
        description: >
          Bits per colour sample. 10 marks an HDR-capable encode.
      - name: sample_rate
        description: >
          Audio sample rate in hertz.
      - name: video_range
        description: >
          SDR or HDR.
      - name: video_range_type
        description: >
          Which HDR format, where the stream is HDR.
      - name: profile
        description: >
          The codec profile the stream was encoded with.
      - name: level
        description: >
          The codec level, which bounds resolution and bitrate.
      - name: stream_key
        description: >
          The natural key: item and index together, because the index is unique only within a
          title.
      - name: is_video
        description: >
          Whether this is the picture.
      - name: is_audio
        description: >
          Whether this is a sound track.
      - name: is_subtitle
        description: >
          Whether this is a subtitle track. The class of stream the old schema discarded
          entirely.
      - name: is_hdr
        description: >
          Whether the stream declares an HDR range. Read with bit_depth: either alone is a
          claim the other does not support.

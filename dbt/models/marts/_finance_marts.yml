version: 2

models:
  - name: fct_finance_transaction
    description: Current transactions.
    columns:
      - name: transaction_key
        description: The tracker's transaction id.
        tests: [not_null, unique]
      - name: booked_on
        description: The bank's booking date.
      - name: booked_month
        description: booked_on truncated to the month.
      - name: account_id
        description: The tracker's account id.
      - name: account_name
        description: The account's name in the tracker.
      - name: bank
        description: The bank or broker holding the account.
      - name: merchant
        description: The counterparty, as the bank labels it.
      - name: amount
        description: Signed amount in the transaction's currency; negative is money out.
      - name: currency
        description: ISO code of the currency the amounts on this row are in.
      - name: amount_home
        description: Signed amount in the home currency, converted by the tracker; negative is money out.
      - name: direction
        description: inflow or outflow.
      - name: category
        description: What the money was for, as a category key (groceries, technology, internet...).
      - name: category_label
        description: The category's display name.
      - name: category_group
        description: The picker section the category belongs to (housing, tech, daily, ...).
      - name: transfer_category
        description: What a transfer paid for, when the owner said (travel, shopping...).
      - name: transaction_type
        description: purchase, subscription, bill, income, refund or transfer.
      - name: type_source
        description: manual when the owner picked the type, derived when the tracker inferred it.
      - name: transfer_kind
        description: internal, external_in or external_out for a detected transfer, else null.
      - name: recurring_series_id
        description: The subscription or bill series this charge belongs to, if any.
      - name: needs_review
        description: The tracker wants the owner to check this transaction.
      - name: tags
        description: The owner's tags, as a JSON array of labels.
      - name: notes
        description: The owner's note on the transaction.
      - name: is_spending
        description: Money out that is not a transfer between the owner's own accounts.
      - name: is_income
        description: Money in that is not a transfer between the owner's own accounts.
  - name: fct_finance_account_balance
    description: Daily account balances.
    columns:
      - name: balance_date
        description: The UTC day the balance was read.
        tests: [not_null]
      - name: account_id
        description: The tracker's account id.
      - name: account_name
        description: The account's name in the tracker.
      - name: bank
        description: The bank or broker holding the account.
      - name: account_type
        description: checking, savings, credit or investment.
      - name: role
        description: What the owner uses the account for (savings, investment, mortgage), if set.
      - name: currency
        description: ISO code of the currency the amounts on this row are in.
      - name: balance
        description: The balance in the account's own currency.
      - name: home_currency
        description: The owner's home currency, e.g. EUR.
      - name: balance_home
        description: The balance converted to the home currency by the tracker.
  - name: dim_finance_recurring_series
    description: Subscriptions and bills.
    columns:
      - name: series_id
        description: The tracker's series id.
      - name: series_name
        description: The subscription or bill's name.
      - name: series_type
        description: subscription or bill.
      - name: status
        description: active, or ended when a charge its cadence expected never came.
      - name: category
        description: What the money was for, as a category key (groceries, technology, internet...).
      - name: account_id
        description: The tracker's account id.
      - name: account_name
        description: The account's name in the tracker.
      - name: frequency
        description: monthly, quarterly or annual.
      - name: currency
        description: ISO code of the currency the amounts on this row are in.
      - name: predicted_next_amount
        description: The expected next charge, in the series currency.
      - name: monthly_projected_amount
        description: The charge spread over one month, in the series currency.
      - name: monthly_projected_home
        description: The monthly projection in the home currency.
      - name: next_due_on
        description: When the next charge is expected.
      - name: first_charged_on
        description: Date of the first charge in the series.
      - name: last_charged_on
        description: Date of the latest charge in the series.
      - name: charge_count
        description: How many charges the series holds.

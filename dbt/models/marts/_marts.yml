version: 2

models:
  - name: fct_http_request
    description: >
      One row per HTTP request: both Nginx Proxy Manager instances, plus
      mcp.ai.example.test's own access log from 2026-09-14 (npm_instance='mcp-api').
      Client addresses are hashed and geography/network are derived at ingestion, as
      before; since 2026-09-14 the raw address and the raw query string are also
      kept, in client_address and query_string, private-warehouse-only -- see
      homelab_datalake.privacy.
    columns:
      - name: request_key
        description: >
          Surrogate key: md5 over instance, timestamp, client hash, path, status and
          bytes. Deliberately not unique. Two genuinely distinct requests can agree on
          all six -- a scanner asking for /login twice in the same second from the same
          address -- and nothing in an access log tells them apart.

          What is tested is that it keeps discriminating, and it is tested per day --
          an all-history average only ever climbs, so one abnormal day poisons every
          build after it, which is what froze this lake for eight days in Sep 2026.
          assert_request_key_inputs_stay_populated fails the build when a column
          feeding the key stops carrying information, which is the case that makes
          the numbers wrong. assert_request_key_stays_discriminating warns when a
          day's duplicate share passes the threshold in that test; measured over 40
          days, the median day, the 95th percentile and the worst -- a scanner flood
          on 3 Sep 2026 -- are all recorded there with their values withheld.
        tests: [not_null]
      - name: partition_date
        description: '{{ doc("req_partition_date") }}'
        tests: [not_null]
      - name: npm_instance
        description: '{{ doc("req_npm_instance") }}'
        tests:
          - not_null
          - accepted_values: {values: ['primary', 'secondary', 'mcp-api']}
      - name: requested_at
        description: '{{ doc("req_requested_at") }}'
        tests: [not_null]
      - name: requested_hour
        description: '{{ doc("req_requested_hour") }}'
      - name: request_host
        description: '{{ doc("req_request_host") }}'
      - name: path
        description: '{{ doc("req_path") }}'
      - name: path_group
        description: '{{ doc("req_path_group") }}'
      - name: query_string
        description: '{{ doc("req_query_string") }}'
      - name: method
        description: '{{ doc("req_method") }}'
      - name: scheme
        description: '{{ doc("req_scheme") }}'
        tests:
          - accepted_values: {values: ['http', 'https']}
      - name: status
        description: '{{ doc("req_status") }}'
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 100, max_value: 599}
      - name: status_class
        description: '{{ doc("req_status_class") }}'
        tests:
          - not_null
          - accepted_values:
              values: ['informational', 'success', 'redirect', 'client_error', 'server_error']
      - name: upstream_status
        description: '{{ doc("req_upstream_status") }}'
      - name: upstream_target
        description: '{{ doc("req_upstream_target") }}'
      - name: bytes_sent
        description: '{{ doc("req_bytes_sent") }}'
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: user_agent
        description: '{{ doc("req_user_agent") }}'
      - name: client_address
        description: '{{ doc("client_address") }}'
      - name: client_hash
        description: '{{ doc("client_hash") }}'
      - name: client_network
        description: '{{ doc("client_network") }}'
      - name: client_trust
        description: >
          Whether the logged address named a visitor (`resolved`) or a Cloudflare
          machine standing in for one (`cdn_edge`). `unknown` means no usable address.
          Deliberately two meaningful values, not three: after the 27 Aug 2026 cutover a
          restored address and an always-direct one are byte-identical, so claiming to
          tell them apart would assert something the data does not contain.
        tests:
          - not_null
          - accepted_values: {values: ['resolved', 'cdn_edge', 'unknown']}
      - name: client_ip_version
        description: '{{ doc("client_ip_version") }}'
        tests:
          - accepted_values: {values: [4, 6], quote: false}
      - name: is_internal
        description: '{{ doc("client_is_internal") }}'
      - name: client_kind
        description: '{{ doc("req_client_kind") }}'
        tests:
          - not_null
          - accepted_values: {values: ['bot', 'browser', 'other', 'unknown']}
      - name: is_automated
        description: '{{ doc("req_is_automated") }}'
      - name: geo_country_code
        description: '{{ doc("geo_country_code") }}'
      - name: geo_country_name
        description: '{{ doc("geo_country_name") }}'
      - name: geo_city
        description: '{{ doc("geo_city") }}'
      - name: geo_asn
        description: '{{ doc("geo_asn") }}'
      - name: geo_as_org
        description: '{{ doc("geo_as_org") }}'
      - name: log_format
        description: '{{ doc("req_log_format") }}'
        tests:
          - not_null
          - accepted_values: {values: ['proxy', 'standard', 'combined', 'mcp_api_json']}

  - name: agg_traffic_daily
    description: >
      Daily traffic per instance, virtual host and audience type. `visitors` counts
      only `resolved` rows -- see the model for why that exclusion is load-bearing.
    columns:
      - name: partition_date
        description: '{{ doc("req_partition_date") }}'
        tests: [not_null]
      - name: npm_instance
        description: '{{ doc("req_npm_instance") }}'
      - name: request_host
        description: '{{ doc("req_request_host") }}'
      - name: client_kind
        description: '{{ doc("req_client_kind") }}'
      - name: requests
        description: Requests in the group, counting bots and people alike.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, inclusive: true}
      - name: visitors
        description: >
          Distinct client hashes, counting only rows whose address named a real client.
          The `cdn_edge` exclusion is load-bearing: before the 27 Aug 2026 real-IP
          cutover a Cloudflare-proxied request logged the edge, so counting every hash
          would average real people with a handful of CDN machines and report a
          confidently wrong number for half the history.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: visitor_networks
        description: >
          Distinct /24 or /48 networks among those visitors. A household behind one
          address counts once here whether or not its address changed, so it moves more
          slowly than `visitors` and is the better shape for a trend.
      - name: requests_behind_cdn
        description: >
          Requests whose logged address was a Cloudflare machine. Not an error: it is
          how much of the day's traffic cannot contribute to a visitor count, which is
          what says whether that count is worth reading.
      - name: bytes_sent
        description: Response bytes in the group, excluding headers.
      - name: requests_success
        description: Requests whose status was 2xx.
      - name: requests_client_error
        description: Requests whose status was 4xx. Mostly scanners on this deployment.
      - name: requests_server_error
        description: Requests whose status was 5xx -- the count worth alerting on.
      - name: server_error_pct
        description: >
          Server errors as a percentage of the group, to three decimals. Null rather
          than zero when the group is empty, so a division by nothing does not read as
          a healthy day.
      - name: countries
        description: >
          Distinct countries in the group. Null geo -- no GeoLite2 database configured
          -- does not count, so this is 0 on a deployment without enrichment rather
          than being wrong.

  - name: fct_llm_call
    # geo_country_code and geo_as_org exist on this table and are null for every row,
    # which is correct rather than missing. LiteLLM records requester_ip_address, and on
    # this deployment all ten distinct values are private: Docker bridges (172.27.x,
    # private container networks) and one LAN machine. MaxMind has no record for private
    # space, so the lookup returns nothing. Every caller is a container on this host.
    #
    # Neither column is exposed by the MCP semantic layer, so no question can be asked
    # that these would silently answer with a null. They are kept because a genuinely
    # external caller would populate them without a schema change.
    description: >
      One row per LLM call through the LiteLLM proxy: model, tokens, latency and cost.
      Prompts and completions are never ingested. Caller address, API key and end user
      are hashed at the ingestion boundary -- the API key because nothing in that
      column distinguishes a hash from a live credential, so it is treated as one.
    columns:
      - name: call_key
        description: LiteLLM's request_id. A genuine natural key, unlike the proxy logs'.
        tests: [not_null, unique]
      - name: partition_date
        description: '{{ doc("llm_partition_date") }}'
        tests: [not_null]
      - name: started_at
        description: '{{ doc("llm_started_at") }}'
        tests: [not_null]
      - name: started_hour
        description: '{{ doc("llm_started_hour") }}'
      - name: model
        description: '{{ doc("llm_model") }}'
      - name: model_group
        description: '{{ doc("llm_model_group") }}'
      - name: provider
        description: '{{ doc("llm_provider") }}'
      - name: call_type
        description: '{{ doc("llm_call_type") }}'
      - name: mcp_tool
        description: '{{ doc("llm_mcp_tool") }}'
      - name: status
        description: '{{ doc("llm_status") }}'
        tests:
          - not_null
          - accepted_values: {values: ['success', 'failure', 'unknown']}
      - name: workload
        description: '{{ doc("llm_workload") }}'
        tests:
          - not_null
          - accepted_values: {values: ['completion', 'embedding', 'mcp', 'other']}
      - name: client_trust
        description: '{{ doc("client_trust") }}'
        tests:
          - not_null
          - accepted_values: {values: ['resolved', 'cdn_edge', 'unknown']}
      - name: spend_usd
        description: LiteLLM's own figure, never recomputed -- see the staging model.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: total_tokens
        description: '{{ doc("llm_total_tokens") }}'
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: prompt_tokens
        description: '{{ doc("llm_prompt_tokens") }}'
      - name: completion_tokens
        description: '{{ doc("llm_completion_tokens") }}'
      - name: usd_per_token
        description: >
          Cost divided by tokens. Null when the call used no tokens, which is a real
          state -- a failure, or a cache hit -- and guarding the divisor rather than the
          numerator is what keeps those rows in the table instead of turning them null
          throughout.
      - name: duration_ms
        description: '{{ doc("llm_duration_ms") }}'
      - name: time_to_first_token_ms
        description: '{{ doc("llm_ttft_ms") }}'
      - name: is_self_hosted
        description: >
          Whether the call went to a locally hosted model. Two values, never null --
          it was three until a null `provider` propagated through an OR, which is the
          kind of thing a not_null test on a boolean exists to catch.
        tests: [not_null]
      - name: was_cache_hit
        description: '{{ doc("llm_was_cache_hit") }}'
        tests: [not_null]
      - name: team_id
        description: '{{ doc("llm_team_id") }}'
      - name: end_user_hash
        description: '{{ doc("llm_end_user_hash") }}'
      - name: api_key_hash
        description: '{{ doc("llm_api_key_hash") }}'
      - name: client_hash
        description: '{{ doc("client_hash") }}'
      - name: session_id
        description: '{{ doc("llm_session_id") }}'
      - name: geo_country_code
        description: >
          Country of the caller. Null for every row on this deployment and correctly so:
          every caller is a container on this host, and MaxMind has no record for
          private address space. Kept because a genuinely external caller would populate
          it without a schema change.
      - name: geo_as_org
        description: >
          Network operator of the caller. Null throughout for the same reason as
          geo_country_code.

  - name: agg_llm_spend_daily
    description: >
      Daily spend by model and workload. Latency is reported as a median because one
      long agent run drags a mean far enough to hide what a normal call costs in time.
    columns:
      - name: partition_date
        description: '{{ doc("llm_partition_date") }}'
        tests: [not_null]
      - name: model
        description: '{{ doc("llm_model") }}'
      - name: provider
        description: '{{ doc("llm_provider") }}'
      - name: workload
        description: '{{ doc("llm_workload") }}'
      - name: calls
        description: Calls in the group, successful or not.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, inclusive: true}
      - name: failures
        description: >
          Calls the proxy recorded as failed. Beside `calls` rather than as a rate, so a
          reader can see whether a [rate withheld] failure rate is one call in two or five hundred
          in a thousand.
      - name: cache_hits
        description: Calls served from the proxy's cache, and therefore not billed by a provider.
      - name: sessions
        description: >
          Distinct sessions in the group. Calls outside a session share a null
          session_id, which `count(distinct)` skips -- so this counts conversations, not
          callers.
      - name: spend_usd
        description: >
          Summed cost, to six decimals. The precision is not decoration: DuckDB's bare
          NUMERIC is DECIMAL(18,3), and rounding to three decimals reported [spend withheld] for
          26 of [count withheld] rows against real spend, because a mistral-small call costs about
          [spend withheld].
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: total_tokens
        description: Prompt and completion tokens summed over the group.
      - name: prompt_tokens
        description: Input tokens summed over the group.
      - name: completion_tokens
        description: Generated tokens summed over the group.
      - name: median_duration_ms
        description: >
          Median end-to-end duration. Median rather than mean: a single 90-second agent
          run drags an average far enough to hide what a normal call costs in time.
      - name: median_ttft_ms
        description: >
          Median time to first token -- the latency a person feels, as opposed to the
          duration the bill reflects.
      - name: usd_per_call
        description: >
          Spend divided by calls, to six decimals. The figure the ingest's own cost
          check watches: a day far above trailing normal is a mispriced model, a retry
          storm, or an agent that will not terminate.

  - name: fct_library_title
    description: >
      One row per movie per snapshot date. No file paths -- in this library they carry
      the source site each file came from -- and no playback history.
    columns:
      - name: title_key
        description: '{{ doc("lib_title_key") }}'
        tests: [not_null, unique]
      - name: item_id
        description: '{{ doc("lib_item_id") }}'
        tests: [not_null]
      - name: snapshot_date
        description: '{{ doc("lib_snapshot_date") }}'
        tests: [not_null]
      - name: title
        description: '{{ doc("lib_title") }}'
        tests: [not_null]
      - name: original_title
        description: '{{ doc("lib_original_title") }}'
      - name: production_year
        description: '{{ doc("lib_production_year") }}'
      - name: decade
        description: '{{ doc("lib_decade") }}'
      - name: premiere_date
        description: '{{ doc("lib_premiere_date") }}'
      - name: added_at
        description: '{{ doc("lib_added_at") }}'
      - name: community_rating
        description: '{{ doc("lib_community_rating") }}'
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 10, inclusive: true}
      - name: critic_rating
        description: '{{ doc("lib_critic_rating") }}'
      - name: official_rating
        description: '{{ doc("lib_official_rating") }}'
      - name: runtime_minutes
        description: '{{ doc("lib_runtime_minutes") }}'
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 600
              inclusive: true
              config:
                where: "is_runtime_plausible"
      - name: is_runtime_plausible
        description: '{{ doc("lib_is_runtime_plausible") }}'
        tests: [not_null]
      - name: is_long_feature
        description: '{{ doc("lib_is_long_feature") }}'
      - name: container
        description: '{{ doc("lib_container") }}'
      - name: video_codec
        description: '{{ doc("lib_video_codec") }}'
      - name: video_height
        description: '{{ doc("lib_video_height") }}'
      - name: video_width
        description: '{{ doc("lib_video_width") }}'
      - name: resolution_class
        description: '{{ doc("lib_resolution_class") }}'
        tests:
          - accepted_values: {values: ['4K', '1080p', '720p', 'SD', 'low']}
      - name: is_high_bit_depth
        description: '{{ doc("lib_is_high_bit_depth") }}'
      - name: audio_codec
        description: '{{ doc("lib_audio_codec") }}'
      - name: audio_channels
        description: '{{ doc("lib_audio_channels") }}'
      - name: studio
        description: '{{ doc("lib_studio") }}'
      - name: production_country
        description: '{{ doc("lib_production_country") }}'
      - name: tmdb_id
        description: '{{ doc("lib_tmdb_id") }}'
      - name: imdb_id
        description: '{{ doc("lib_imdb_id") }}'
      - name: is_enrichable
        description: >
          Whether the title carries a TMDB id at all. Naming the gap as a column means a
          query can exclude it rather than silently averaging over titles that were
          never enrichable.
        tests: [not_null]
      - name: is_enriched
        description: >
          Whether TMDB actually returned figures for it. Different from is_enrichable:
          false with is_enrichable true means the lookup has not run or has no key
          configured, which is a supported state rather than a fault.
      - name: original_language
        description: '{{ doc("lib_original_language") }}'
      - name: budget_usd
        description: '{{ doc("lib_budget_usd") }}'
      - name: revenue_usd
        description: '{{ doc("lib_revenue_usd") }}'
      - name: revenue_to_budget
        description: '{{ doc("lib_revenue_to_budget") }}'
      - name: tmdb_popularity
        description: >
          TMDB's popularity score. Relative and time-varying, so it ranks titles against
          each other on the day it was fetched and means nothing as an absolute figure.
      - name: tmdb_vote_count
        description: >
          How many people rated the film on TMDB. The figure that says whether
          community_rating is worth trusting -- a 9.0 from eleven voters is not a 9.0
          from eleven thousand.

  - name: dim_genre
    description: Genres, keyed by a hash so a metadata refresh renaming one cannot break joins.
    columns:
      - name: genre_key
        description: '{{ doc("lib_genre_key") }}'
        tests: [not_null, unique]
      - name: genre_name
        description: '{{ doc("lib_genre") }}'
        tests: [not_null, unique]

  - name: bridge_title_genre
    description: >
      The many-to-many between titles and genres, at snapshot grain. A bridge rather
      than genre_1/genre_2/genre_3, which would truncate the tail -- some titles carry
      six genres.
    columns:
      - name: title_key
        description: '{{ doc("lib_title_key") }}'
        tests:
          - not_null
          - relationships: {to: ref('fct_library_title'), field: title_key}
      - name: genre_key
        description: '{{ doc("lib_genre_key") }}'
        tests:
          - not_null
          - relationships: {to: ref('dim_genre'), field: genre_key}
      - name: snapshot_date
        description: >
          The day this pairing was true. Snapshot-grained on purpose: a title's genres
          change when its metadata is refreshed, and the bridge should say what was true
          on the day rather than only what is true now.
      - name: item_id
        description: '{{ doc("lib_item_id") }}'
        tests:
          - relationships: {to: ref('fct_library_title'), field: item_id}
      - name: genre
        description: >
          The genre name, carried beside its key so a reader can see the pairing without
          joining the dimension.

  - name: dim_title_scd2
    description: >
      Type-2 history over the daily snapshots: when a title arrived, when a rating
      moved, when a file was re-encoded. Built as a pure function of the Parquet
      partitions rather than dbt's stateful snapshot materialisation, so dropping the
      warehouse and rebuilding produces identical history.
    columns:
      - name: title_version_key
        description: >
          Surrogate key over item id and version number. One row per run of unchanged
          attributes, which is the grain of this table.
        tests: [not_null, unique]
      - name: item_id
        description: '{{ doc("lib_item_id") }}'
        tests:
          - not_null
          # Every version of a title must name a title that exists. Measured before
          # declaring: [count withheld] distinct ids, zero orphans.
          - relationships: {to: ref('fct_library_title'), field: item_id}
      - name: version
        description: >
          How many times this title's tracked attributes had changed when this row
          began. 0 is the title as first seen.
      - name: valid_from
        description: The first snapshot date this version was observed on.
        tests: [not_null]
      - name: valid_to
        description: >
          The last snapshot date this version was observed on, or null for the current
          one. Null rather than a sentinel date: a sentinel sorts and filters like a
          real date, which is how "as of" queries quietly return the wrong version.
      - name: is_current
        description: Whether this is the version seen in the most recent snapshot.
        tests: [not_null]
      - name: title
        description: '{{ doc("lib_title") }}'
      - name: community_rating
        description: '{{ doc("lib_community_rating") }}'
      - name: video_codec
        description: '{{ doc("lib_video_codec") }}'
      - name: resolution_class
        description: '{{ doc("lib_resolution_class") }}'
      - name: runtime_minutes
        description: '{{ doc("lib_runtime_minutes") }}'

  - name: fct_library_item
    description: >
      One row per series, season, episode, box set or other video per snapshot --
      everything in the library that fct_library_title does not cover, which is
      movies only. A plain snapshot fact rather than a second dim_title_scd2: see the
      model's own SQL for why five very different grains (a container with no file,
      a real video file, a show that borrows its rating from an episode) do not share
      one versioning scheme, and why genres/tags/studios stay as list columns rather
      than a second bridge and dimension.
    columns:
      - name: item_key
        description: Surrogate key over item_id and snapshot_date.
        tests: [not_null, unique]
      - name: item_id
        description: '{{ doc("lit_item_id") }}'
        tests: [not_null]
      - name: snapshot_date
        description: '{{ doc("lib_snapshot_date") }}'
        tests: [not_null]
      - name: item_type
        description: '{{ doc("lit_item_type") }}'
        tests:
          - not_null
          - accepted_values: {values: ['Series', 'Season', 'Episode', 'BoxSet', 'Video']}
      - name: is_series
        description: '{{ doc("lit_is_series") }}'
      - name: is_episode
        description: '{{ doc("lit_is_episode") }}'
      - name: title
        description: '{{ doc("lit_title") }}'
      - name: original_title
        description: '{{ doc("lib_original_title") }}'
      - name: production_year
        description: '{{ doc("lib_production_year") }}'
      - name: premiere_date
        description: '{{ doc("lib_premiere_date") }}'
      - name: end_date
        description: '{{ doc("lit_end_date") }}'
      - name: status
        description: '{{ doc("lit_status") }}'
        tests:
          - accepted_values: {values: ['Continuing', 'Ended'], config: {severity: warn}}
      - name: added_at
        description: '{{ doc("lib_added_at") }}'
      - name: community_rating
        description: '{{ doc("lib_community_rating") }}'
      - name: critic_rating
        description: '{{ doc("lib_critic_rating") }}'
      - name: official_rating
        description: '{{ doc("lib_official_rating") }}'
      - name: runtime_minutes
        description: '{{ doc("lit_runtime_minutes") }}'
      - name: container
        description: '{{ doc("lib_container") }}'
      - name: video_codec
        description: '{{ doc("lib_video_codec") }}'
      - name: video_height
        description: '{{ doc("lib_video_height") }}'
      - name: video_width
        description: '{{ doc("lib_video_width") }}'
      - name: resolution_class
        description: '{{ doc("lib_resolution_class") }}'
      - name: audio_codec
        description: '{{ doc("lib_audio_codec") }}'
      - name: audio_channels
        description: '{{ doc("lib_audio_channels") }}'
      - name: tmdb_id
        description: '{{ doc("lib_tmdb_id") }}'
      - name: imdb_id
        description: '{{ doc("lib_imdb_id") }}'
      - name: tvdb_id
        description: TVDB identifier, where Jellyfin matched one.
      - name: studio
        description: '{{ doc("lib_studio") }}'
      - name: studios
        description: Every studio credited, in the order the API gave them.
      - name: production_country
        description: '{{ doc("lib_production_country") }}'
      - name: production_countries
        description: Every production country, primary first.
      - name: genres
        description: '{{ doc("lit_genres") }}'
      - name: sort_name
        description: The name the library sorts by.
      - name: overview
        description: The item's synopsis, where Jellyfin has one.
      - name: tagline
        description: The item's marketing line, first one only.
      - name: taglines
        description: Every tagline the library holds for the item.
      - name: tags
        description: Free-form tags applied to the item.
      - name: parent_id
        description: '{{ doc("lit_parent_id") }}'
      - name: series_id
        description: '{{ doc("lit_series_id") }}'
      - name: series_name
        description: '{{ doc("lit_series_name") }}'
      - name: season_id
        description: '{{ doc("lit_season_id") }}'
      - name: season_name
        description: '{{ doc("lit_season_name") }}'
      - name: season_number
        description: '{{ doc("lit_season_number") }}'
      - name: episode_number
        description: '{{ doc("lit_episode_number") }}'
      - name: stream_count
        description: How many media streams the item has, where it has any.
      - name: remote_trailer_count
        description: How many trailers the library knows about for the item.
      - name: external_urls
        description: The item's pages on public databases, as name and url pairs.
      - name: file_size_bytes
        description: Size of the primary media file, for an Episode or a Video.
      - name: file_bitrate
        description: Overall bitrate of the primary media file.
      - name: media_source_count
        description: How many media sources the item has.
      - name: unmapped_json
        description: '{{ doc("lit_unmapped_json") }}'

  - name: dim_jellyfin_user
    description: >
      The account each play and activity entry points at. Latest snapshot only --
      accounts do not carry the kind of history dim_title_scd2 exists for.
    columns:
      - name: user_id
        description: '{{ doc("usr_user_id") }}'
        tests: [not_null, unique]
      - name: user_name
        description: '{{ doc("usr_user_name") }}'
      - name: is_administrator
        description: '{{ doc("usr_is_administrator") }}'
      - name: is_disabled
        description: '{{ doc("usr_is_disabled") }}'
      - name: last_login
        description: '{{ doc("usr_last_login") }}'
      - name: last_activity
        description: '{{ doc("usr_last_activity") }}'
      - name: last_snapshot_date
        description: The day of the most recent account snapshot this row was built from.
        tests: [not_null]

  - name: fct_jellyfin_playback
    description: >
      One row per playback session, joined to the title dimension where it resolves.
      The plugin records how long the player was open, which is not proof of a
      finished viewing -- a paused film and an abandoned one both accumulate seconds.
      An episode's series is resolved by id against fct_library_item where that
      snapshot reaches it (series_resolved_by_id says which rows), with the
      item_name-parsed series name kept as the documented fallback -- [rate withheld] of
      distinct episodes ever played, [rate withheld] of episode rows, measured 2026-09-15; see
      the model's own SQL for the numbers behind that. No relationship test joins
      `item_id` to `fct_library_title` or `user_id` to `dim_jellyfin_user`: the movie
      library snapshot is movies only, so every Episode, Video and TvChannel session
      is a legitimate non-match (`is_in_library` exists for exactly this), and
      measured against this server's real history, 3 of 16 distinct playback
      accounts and dozens of activity-log accounts are not in the current `/Users`
      list at all -- deleted or system accounts, not a data-quality bug a
      foreign-key test should fail the build over.
    columns:
      - name: playback_key
        description: Surrogate key over started_at, user_id and item_id -- the closest thing PlaybackActivity has to a natural key.
        tests: [not_null, unique]
      - name: partition_date
        description: '{{ doc("pb_partition_date") }}'
        tests: [not_null]
      - name: partition_hour
        description: '{{ doc("pb_partition_hour") }}'
        tests: [not_null]
      - name: extracted_at
        description: '{{ doc("pb_extracted_at") }}'
      - name: started_at
        description: '{{ doc("pb_started_at") }}'
        tests: [not_null]
      - name: started_hour
        description: '{{ doc("pb_started_hour") }}'
      - name: started_hour_of_day
        description: '{{ doc("pb_started_hour_of_day") }}'
      - name: started_weekday
        description: '{{ doc("pb_started_weekday") }}'
      - name: is_weekend
        description: '{{ doc("pb_is_weekend") }}'
      - name: user_id
        description: '{{ doc("pb_user_id") }}'
      - name: user_name
        description: '{{ doc("pb_user_name") }}'
      - name: item_id
        description: '{{ doc("pb_item_id") }}'
        tests: [not_null]
      - name: item_type
        description: '{{ doc("pb_item_type") }}'
      - name: title
        description: The title as the plugin recorded it -- item_name, under the name this dataset's dimension uses.
      - name: series_id
        description: >
          The episode's series, resolved by id against fct_library_item's latest
          snapshot. Null when the id join does not reach it -- see
          series_resolved_by_id -- and always null for anything that is not an
          episode, since there is no parsed fallback for an id.
      - name: series_name
        description: >
          The series name, from the id join above when it resolves, falling back to
          the name parsed out of item_name (pb_series_name at the staging layer)
          when it does not. series_resolved_by_id says which source supplied this
          value for a given row.
      - name: series_resolved_by_id
        description: >
          True when series_id/series_name came from the id join against
          fct_library_item; false when they fell back to the item_name parse (or
          both are null, for anything that is not an episode). Measured 2026-09-15:
          false for [rate withheld] of episode playback rows.
        tests: [not_null]
      - name: season_number
        description: '{{ doc("lit_season_number") }}. Null when the id join does not resolve -- there is no parsed fallback for a season number.'
      - name: episode_number
        description: '{{ doc("lit_episode_number") }}. Null when the id join does not resolve -- there is no parsed fallback for an episode number.'
      - name: is_episode
        description: '{{ doc("pb_is_episode") }}'
      - name: genre
        description: >
          The title's primary genre, from bridge_title_genre. Not the full list: joining
          the bridge at fact grain would multiply every watch-time measure by the number
          of genres a film carries, the same trade-off stg_jellyfin_titles already makes
          for studio and production_country. Null for anything not in the movie library.
        tests:
          - relationships: {to: ref('dim_genre'), field: genre_name}
      - name: playback_method
        description: '{{ doc("pb_playback_method") }}'
      - name: client_name
        description: '{{ doc("pb_client_name") }}'
      - name: device_name
        description: '{{ doc("pb_device_name") }}'
      - name: play_duration_seconds
        description: '{{ doc("pb_play_duration_seconds") }}'
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: is_in_library
        description: >
          Whether item_id resolved against the current version of dim_title_scd2.
          True for a Movie; always false for an Episode, Video or TvChannel, because
          none of those are ever fetched into the library snapshot.
        tests: [not_null]
      - name: library_community_rating
        description: TMDB's vote average for the title, from the library snapshot. Null unless is_in_library.

  - name: fct_jellyfin_activity
    description: >
      One row per server activity log entry: sign-ins, playback starts and stops,
      library and account changes. No relationship test joins user_id to
      dim_jellyfin_user -- see fct_jellyfin_playback's note; the same deleted and
      system accounts appear here too, in greater number.
    columns:
      - name: activity_id
        description: '{{ doc("act_activity_id") }}'
        tests: [not_null, unique]
      - name: partition_date
        description: '{{ doc("act_partition_date") }}'
        tests: [not_null]
      - name: extracted_at
        description: '{{ doc("act_extracted_at") }}'
      - name: happened_at
        description: '{{ doc("act_happened_at") }}'
        tests: [not_null]
      - name: happened_hour
        description: '{{ doc("act_happened_hour") }}'
      - name: happened_hour_of_day
        description: Hour of day, 0 to 23, in UTC.
      - name: happened_weekday
        description: Weekday name of happened_at, in UTC.
      - name: is_weekend
        description: Whether happened_at fell on a Saturday or a Sunday, in UTC.
      - name: activity_type
        description: '{{ doc("act_activity_type") }}'
      - name: name
        description: '{{ doc("act_name") }}'
      - name: overview
        description: '{{ doc("act_overview") }}'
      - name: short_overview
        description: '{{ doc("act_short_overview") }}'
      - name: user_id
        description: '{{ doc("act_user_id") }}'
      - name: user_name
        description: The account's name, joined from dim_jellyfin_user. Null when user_id is null or the account no longer appears in the current snapshot.
      - name: item_id
        description: '{{ doc("act_item_id") }}'
      - name: severity
        description: '{{ doc("act_severity") }}'
        tests:
          - accepted_values: {values: ['Information', 'Warning', 'Error']}
      - name: is_error
        description: '{{ doc("act_is_error") }}'
      - name: is_warning
        description: '{{ doc("act_is_warning") }}'
      - name: unmapped_json
        description: >
          JSON, or null. Any field the activity log sent that the raw schema does not
          name.

  - name: fct_camera_event
    description: >
      One row per camera event, latest version. Vision analysis lands hours after the
      event, so a partition is re-read as a matter of course; int_camera_events keeps
      the newest version per event id.
    columns:
      - name: event_id
        description: Unique here precisely because the intermediate model dedupes versions.
        tests: [not_null, unique]
      - name: partition_date
        description: '{{ doc("cam_partition_date") }}'
        tests: [not_null]
      - name: started_at
        description: '{{ doc("cam_started_at") }}'
        tests: [not_null]
      - name: completed_at
        description: '{{ doc("cam_completed_at") }}'
      - name: duration_seconds
        description: '{{ doc("cam_duration_seconds") }}'
      - name: started_hour
        description: >
          `started_at` truncated to the hour, in UTC. Pinned by the session timezone, so
          two readers on different machines bucket the same event the same way.
      - name: started_hour_of_day
        description: >
          Hour of the day, 0 to 23, in UTC. This and the weekday are the analysis camera
          data is actually for: when does the garden get busy, does the weekend differ.
      - name: started_weekday
        description: Weekday name of the event, in UTC.
      - name: is_weekend
        description: Whether the event fell on a Saturday or a Sunday, in UTC.
      - name: camera_id
        description: '{{ doc("cam_camera_id") }}'
        tests: [not_null]
      - name: zone_id
        description: '{{ doc("cam_zone_id") }}'
        tests:
          - relationships: {to: ref('dim_camera_zone'), field: zone_id}
      - name: zone_name
        description: '{{ doc("cam_zone_name") }}'
      - name: lifecycle
        description: '{{ doc("cam_lifecycle") }}'
        tests:
          - not_null
          - accepted_values: {values: ['confirmed', 'dismissed', 'candidate']}
      - name: is_confirmed
        description: '{{ doc("cam_is_confirmed") }}'
      - name: is_awaiting_analysis
        description: '{{ doc("cam_is_awaiting_analysis") }}'
      - name: rule_type
        description: >
          The kind of rule that raised the event. This list is RULE_TYPES in the
          camera's own src/services/attention-zone-store.js, not the set of values
          seen so far -- the same distinction dismissal_reason below already makes.

          It was the sampled version until 29 Aug 2026, when one `presence` event
          arrived and failed the build. Three of the seven had simply never fired.
          A test built from a sample does not test the vocabulary; it records which
          features happened to be switched on the day it was written.
        tests:
          - not_null
          - accepted_values:
              values: ['motion', 'crossing', 'state', 'presence', 'absence',
                       'object_removed', 'unusual']
      - name: dismissal_reason
        description: >
          Null when the event was not dismissed. A value outside this list means the
          camera app started emitting something the pipeline does not understand, and
          the build should stop rather than let an unknown category into the marts.

          The list is every value the app's source can produce, not the set that
          appeared in a sample. The first version was built from two months of observed
          data and duly failed on `unchanged_state`, which is rarer than that window --
          an enumeration read off the data is a sample, and a sample is not a contract.

          Unlike `rule_type` above, there is no single RULE_TYPES-style constant to read
          this off of; the values below were collected by reading every place the app's
          source sets `dismissalReason`. Seven come from the running pipeline itself:
          `semantic_no_event` and `semantic_state_unchanged` from the semantic analysis
          outcome, `human_correction` from a person dismissing an event by hand,
          `recording_unavailable` and `recording_failed` when the video window a
          decision depended on could not be read, `unchanged_state` when a state rule
          fired on no real movement, `analysis_failed` when the analysis pipeline itself
          errored, and `superseded_reanalysis` when a later reanalysis replaced an
          earlier one.

          The rest are markers a one-off maintenance script under the app's `scripts/`
          wrote directly into its event store -- not a path the running app takes on its
          own, but real, because the script actually ran against real data: `duplicate`
          from the 25 Aug 2026 backlog repair (`repair_portal_backlog_20260825.js`);
          `stable_state` and `ambiguous_legacy_state` from
          `reclassify_attention_history.py`, which replays legacy state claims against
          calibrated reference images; and `pixel_replay_no_crossing` from
          `apply_attention_replay_report.js`'s saved-clip crossing replay.
          `semantic_fallback` stays accepted too, though today's source only uses that
          name for a count-reconciliation decision, not a `dismissalReason` it writes --
          real curated data already holds it, and nothing here explains where from.

          `duplicate_late_confirmation` is the same kind of marker, and the one that
          froze this build: `repair_portal_cycles_20260911.js` and
          `repair_portal_afternoon_20260911.js` used it on 11 Sep 2026 to dismiss a
          second, late confirmation of a portal cycle whose closing an earlier event had
          already recorded correctly -- two rows, two separate incidents that day,
          neither one the app doing this by itself.
        tests:
          - accepted_values:
              values: ['semantic_no_event', 'semantic_state_unchanged', 'semantic_fallback',
                       'human_correction', 'recording_unavailable', 'recording_failed',
                       'unchanged_state', 'analysis_failed', 'superseded_reanalysis',
                       'duplicate', 'duplicate_late_confirmation', 'stable_state',
                       'ambiguous_legacy_state', 'pixel_replay_no_crossing']
      - name: direction
        description: '{{ doc("cam_direction") }}'
        tests:
          - accepted_values: {values: ['entrée', 'sortie']}
      - name: zone_state
        description: '{{ doc("cam_zone_state") }}'
        tests:
          - accepted_values: {values: ['open', 'closed', 'partly_open']}
      - name: previous_zone_state
        description: '{{ doc("cam_previous_zone_state") }}'
      - name: state_changed
        description: >
          Whether the zone's state differs from its previous one. Compared with `is
          distinct from`, so an event where one side is null still counts as a change
          rather than evaluating to null and disappearing from both sides of a filter.
      - name: confidence
        description: >
          Null means the model declined to commit, which is a different fact from a low
          score and must stay distinguishable.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}
      - name: is_unusual
        description: '{{ doc("cam_is_unusual") }}'
      - name: should_notify
        description: '{{ doc("cam_should_notify") }}'
      - name: duplicate_of
        description: '{{ doc("cam_duplicate_of") }}'
      - name: is_duplicate
        description: >
          Whether the camera recognised this event as a repeat of another. The flag to
          filter on before counting events, since a duplicate is one real happening
          recorded twice.
      - name: summary
        description: '{{ doc("cam_summary") }}'
      - name: clip_id
        description: '{{ doc("cam_clip_id") }}'
        tests:
          - relationships: {to: ref('fct_camera_clip'), field: clip_id}
      - name: extracted_at
        description: >
          When this pipeline read the version of the event that survived. Beside the
          event rather than dropped, because "why did this row change since yesterday"
          is answered by it and by nothing else.

      - name: rule_id
        description: >
          The rule inside the zone that fired. Joins to dim_camera_zone; it landed in raw from
          the first partition and was never surfaced until now.
        tests:
          - relationships: {to: ref('dim_camera_zone'), field: rule_id}
      - name: is_dismissed
        description: >
          Whether the camera marked the event dismissed outright, rather than it being
          inferred from lifecycle.
      - name: occurred_at
        description: >
          When the event actually happened, which a replay or a repair moves away from
          started_at. Null when the camera never recorded one.
      - name: happened_at
        description: >
          The instant to rank an event by: occurred_at when the camera knows it, started_at
          otherwise. Resolved once, here, because the camera's own report does the same
          fallback and anything that wants to agree with it must too.
      - name: state_observed_at
        description: >
          When the zone's state was observed. For a gate transition this is the instant the
          gate was seen to have moved -- it existed in raw and staging and was dropped at the
          mart, which is why a portal report had only the day and the hour to work with.
      - name: state_source
        description: >
          How a state reading was arrived at, where the camera recorded something other than
          the ordinary analysis path.
      - name: count_person
        description: >
          How many people the event counted. Null means nothing was counted, which is not the
          same as zero: an event nobody counted is not an event that counted nobody.
      - name: count_vehicle
        description: >
          How many vehicles the event counted. Null and zero are different, as for
          count_person.
      - name: count_animal
        description: >
          How many animals the event counted. Null and zero are different, as for
          count_person.
      - name: count_other
        description: >
          How many other subjects the event counted. Null and zero are different, as for
          count_person.
      - name: count_total
        description: >
          The four subject counts added together, or null when nothing was counted. Every
          graph of this data is a sum over these -- summing four columns by hand is how a
          headline comes to disagree with the rows beneath it.
      - name: was_corrected
        description: >
          Whether a person overwrote what the machine concluded about this event. Without it a
          corrected figure is indistinguishable from one nobody touched.
      - name: corrected_at
        description: >
          When the correction was made.
      - name: corrected_by_name
        description: >
          Who made the correction. The name travels because a pseudonym does not answer 'who
          overrode this'.
      - name: corrected_by_hash
        description: >
          Salted hash of the person who made the correction, for grouping without naming.
      - name: machine_lifecycle
        description: >
          What the machine originally concluded the lifecycle was, before a person changed it.
      - name: machine_direction
        description: >
          The direction the machine originally reported.
      - name: machine_zone_state
        description: >
          The state the machine originally reported.
      - name: machine_previous_zone_state
        description: >
          The previous state the machine originally reported.
      - name: machine_state_observed_at
        description: >
          When the machine originally said the state was observed.
      - name: machine_dismissal_reason
        description: >
          The dismissal reason the machine originally gave.
      - name: machine_duplicate_of
        description: >
          The event the machine originally thought this duplicated.
      - name: machine_summary
        description: >
          The description the machine originally wrote.
      - name: machine_confidence
        description: >
          The confidence the machine originally reported. Comparing it against a correction is
          how 'is the model overconfident when it is wrong' becomes answerable.
      - name: machine_should_notify
        description: >
          Whether the machine originally decided to notify.
      - name: machine_count_person
        description: >
          How many people the machine originally counted.
      - name: machine_count_vehicle
        description: >
          How many vehicles the machine originally counted.
      - name: machine_count_animal
        description: >
          How many animals the machine originally counted.
      - name: machine_count_other
        description: >
          How many other subjects the machine originally counted.
      - name: lifecycle_was_corrected
        description: >
          Whether the correction actually changed the lifecycle. Called out because it is one
          of the two corrections that move a headline figure; the other is the zone state.
      - name: zone_state_was_corrected
        description: >
          Whether the correction actually changed the zone state -- the other correction that
          moves a headline figure.
      - name: transition_clip_id
        description: >
          The clip that filmed the gate moving. For a state change clip_id shows a gate that
          has already finished moving, so a reader wanting the transition wants this one.
      - name: clip_kind
        description: >
          What caused the recording the event points at -- attention, or a manual save.
      - name: clip_title
        description: >
          The clip's own label, such as "1 personne".
      - name: clip_duration_seconds
        description: >
          How long the clip runs.
      - name: clip_size_bytes
        description: >
          The clip's size on disk.
      - name: clip_storage_quality
        description: >
          The rendition kept for the clip.
      - name: clip_is_archived
        description: >
          Whether the clip has been moved to the archive.
      - name: clip_is_deleted
        description: >
          Whether the clip has been deleted. The event survives the footage.
      - name: clip_ai_source
        description: >
          Which detector raised the clip.
      - name: clip_ai_type
        description: >
          What that detector thought it saw. Comparable against the event's own rule_type.
      - name: clip_local_confidence
        description: >
          The local detector's score on the clip, which is not the vision model's confidence
          on the event.
      - name: clip_annotation_count
        description: >
          How many notes were left on the clip.
      - name: has_clip
        description: >
          Whether the event resolved to a clip at all. False is normal for an event whose
          analysis has not produced one yet.
      - name: backfill_json
        description: >
          JSON. Present when the row was written by a backfill rather than the live path.
      - name: repair_json
        description: >
          JSON. Present when the row was reconstructed by a repair, naming the incident.
      - name: restoration_json
        description: >
          JSON. Present when the row was restored from a backup.
      - name: timing_correction_json
        description: >
          JSON. Present when the event's own timestamps were corrected, with the previous
          values and the evidence.
      - name: unmapped_json
        description: >
          JSON, or null. Anything the export sent that the raw schema does not name. Carried
          onto the fact rather than left in raw, because the person who notices it is the one
          looking at the data.
  - name: agg_camera_activity_daily
    description: Daily activity by camera, zone and rule.
    columns:
      - name: partition_date
        description: '{{ doc("cam_partition_date") }}'
        tests: [not_null]
      - name: camera_id
        description: '{{ doc("cam_camera_id") }}'
      - name: zone_name
        description: '{{ doc("cam_zone_name") }}'
      - name: rule_type
        description: '{{ doc("cam_rule_type") }}'
      - name: events
        description: Events in the group, before any filtering for duplicates or dismissals.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, inclusive: true}
      - name: confirmed
        description: Events analysis confirmed as real.
      - name: dismissed
        description: >
          Events analysis rejected. High beside a low `confirmed` is a zone whose rule is
          firing on something that is not worth an event.
      - name: awaiting_analysis
        description: >
          Events still candidates when the partition was read. A few on the current day
          are normal; a run of them across older days means the analysis pipeline has
          stopped.
      - name: notified
        description: Events the camera judged worth telling somebody about.
      - name: unusual
        description: Events analysis judged out of the ordinary for that zone and hour.
      - name: duplicates
        description: Events recognised as repeats of another. Subtract before counting real happenings.
      - name: scored_events
        description: >
          Events that carry a confidence. It travels beside the average because avg()
          skips nulls, and an average over three events reads identically to one over
          three hundred otherwise.
      - name: avg_confidence
        description: >
          Mean confidence over the scored events only, to four decimals. Cast through
          DECIMAL(18,9) rather than bare NUMERIC, which is DECIMAL(18,3) in DuckDB and
          would round 0.8125 to 0.813 and make the four decimals a lie.
      - name: median_duration_seconds
        description: >
          Median event duration, to one decimal. Unresolved events carry no duration and
          do not contribute.
      - name: corrected
        description: >
          How many of the day's events a person overrode. Rising against a steady event count
          means the model is drifting.
      - name: with_clip
        description: >
          How many of the day's events resolved to a clip.
      - name: people
        description: >
          People counted across the day's events. Null when nothing was counted, which is not
          a measured zero.
      - name: vehicles
        description: >
          Vehicles counted across the day's events.
      - name: animals
        description: >
          Animals counted across the day's events.
      - name: other_subjects
        description: >
          Other subjects counted across the day's events.
      - name: subjects
        description: >
          All four subject counts added together -- the figure the alerts graph plots.
      - name: counted_events
        description: >
          How many of the day's events carried a count at all. Travels beside the sums so an
          average over three events does not read like one over three hundred.
  - name: fct_camera_clip
    description: >
      One row per clip, with the event that caused it. The mirror of fct_camera_event: 'what
      did the cameras see' is answered by the event, 'what is on disk, how big is it, and is
      it still there' is answered by the clip -- and [count withheld] clips had no model at all, so the
      second question had no table.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: unmapped_json
        description: >
          JSON, or null. Anything the export sent that the raw schema does not name, kept
          rather than dropped.
      - name: zone_id
        description: >
          The zone this belongs to. Joins to dim_camera_zone.
        tests:
          - relationships: {to: ref('dim_camera_zone'), field: zone_id}
      - name: zone_name
        description: >
          The zone's display name -- Portail, Animaux.
      - name: clip_id
        description: >
          The clip's stable id. What fct_camera_event.clip_id points at; every one of them
          resolves.
      - name: clip_kind
        description: >
          What caused the recording -- `attention` for an analysed event, `manual` for one
          somebody saved.
      - name: clip_title
        description: >
          The clip's label, such as "1 personne". Generated from what the analysis found, and
          the caption the app itself shows.
      - name: created_at
        description: >
          When the recording started.
      - name: saved_at
        description: >
          When it finished being written out.
      - name: save_latency_seconds
        description: >
          How long the clip took to be written after it began. A rising figure is the recorder
          falling behind, which nothing else here would show.
      - name: created_hour
        description: >
          The hour the clip was created, truncated. For grouping without re-deriving it per
          query.
      - name: created_hour_of_day
        description: >
          Hour of day, 0-23, in UTC. The shape of a day.
      - name: created_weekday
        description: >
          Weekday name, in UTC.
      - name: is_weekend
        description: >
          Whether the clip was created at the weekend.
      - name: duration_seconds
        description: >
          How long the clip runs.
      - name: size_bytes
        description: >
          Size on disk.
      - name: bytes_per_second
        description: >
          Size over duration. Null when either is missing or zero. A sudden change means
          encoder settings moved.
      - name: segment_count
        description: >
          How many HLS segments the clip is made of.
      - name: storage_quality
        description: >
          The rendition kept -- 240p for a routine attention clip, higher for one somebody
          saved.
      - name: is_archived
        description: >
          Whether the clip has been moved to the archive rather than the live history.
      - name: is_deleted
        description: >
          Whether the clip has been deleted. Kept as a row so a deletion is visible rather
          than a gap.
      - name: ai_source
        description: >
          Which detector raised it -- `opencv` for local motion, or the vision model.
      - name: ai_type
        description: >
          What that detector thought it saw.
      - name: local_confidence
        description: >
          The local detector's own score. Not the vision model's confidence on the event; two
          judgements about one moment, named apart.
      - name: created_by_hash
        description: >
          Salted hash of whoever saved the clip by hand. Null for one the system recorded on
          its own.
      - name: was_saved_by_a_person
        description: >
          Whether a person saved this clip deliberately, derived from created_by_hash.
      - name: annotation_count
        description: >
          How many notes were left on the clip.
      - name: is_annotated
        description: >
          Whether anybody left a note on it -- the clips somebody actually looked at.
      - name: event_id
        description: >
          The attention event that caused the recording, when one did.
        tests:
          - relationships: {to: ref('fct_camera_event'), field: event_id}
      - name: rule_type
        description: >
          What the causing event's rule watched.
      - name: event_lifecycle
        description: >
          What the causing event was concluded to be.
      - name: event_confidence
        description: >
          The vision model's confidence on the causing event.
      - name: event_zone_state
        description: >
          The zone state the causing event reported.
      - name: event_count_total
        description: >
          How many subjects the causing event counted.
      - name: has_event
        description: >
          Whether the clip resolved to an event. False for a manual recording, and for one
          whose event was swept.
  - name: fct_camera_coverage
    description: >
      One row per span where a zone could not be read. The table that makes a gate report
      honest: 'closed all afternoon' means one thing when the camera could see the gate
      throughout and another when it could not see it at all, and until this existed the
      warehouse drew the second as the first.
    columns:
      - name: partition_date
        description: >
          Partition date: the UTC day this row belongs to, taken from the data rather than
          from the file it was found in.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.
      - name: unmapped_json
        description: >
          JSON, or null. Anything the export sent that the raw schema does not name, kept
          rather than dropped.
      - name: zone_id
        description: >
          The zone this belongs to. Joins to dim_camera_zone.
        tests:
          - relationships: {to: ref('dim_camera_zone'), field: zone_id}
      - name: zone_name
        description: >
          The zone's display name -- Portail, Animaux.
      - name: span_id
        description: >
          Stable id built from the zone and the instant the span began, so re-reading a window
          merges rather than duplicating.
      - name: is_on_a_gate_zone
        description: >
          Whether the unreadable zone is one with a gate rule. A blind span on a gate is the
          one that makes a portal report wrong.
      - name: reason
        description: >
          Why the zone was unreadable. `night_blind` is darkness; `out_of_view` and `lost` are
          the tracker losing the region; `state_unconfirmed` is the freshness lease expiring
          rather than the picture going away.
      - name: detail
        description: >
          Any extra explanation the camera recorded alongside the reason.
      - name: is_lease_expiry
        description: >
          Whether this is the freshness lease expiring rather than a camera that could not
          see. A timing artefact that must not be counted as vision loss.
      - name: is_vision_loss
        description: >
          Whether the camera genuinely could not see -- darkness, the region out of view, an
          unreadable picture.
      - name: from_at
        description: >
          When the span began.
      - name: to_at
        description: >
          When it ended, or the end of the window asked for when it had not. Read with
          is_ongoing.
      - name: is_ongoing
        description: >
          Whether the span was still open at the end of the window. True means to_at is where
          the question stopped, not where the blindness did.
      - name: duration_seconds
        description: >
          How long the zone was unreadable.
      - name: duration_minutes
        description: >
          The same, in minutes, for reading rather than computing.
      - name: from_hour
        description: >
          The hour the span began, truncated.
      - name: from_hour_of_day
        description: >
          Hour of day the span began, 0-23, UTC.
      - name: from_weekday
        description: >
          Weekday the span began, UTC.
  - name: dim_camera_zone
    description: >
      The zone and rule a camera event points at. Without it the only clue that a zone is a
      gate is that its events happen to carry rule_type 'state', which is inference from the
      data rather than a fact about the configuration -- and it says nothing about a zone that
      has fired no events.
    columns:
      - name: zone_rule_key
        description: >
          The grain. A zone with several rules is several rows, so neither id alone is the
          key.
      - name: zone_id
        description: >
          The zone's stable id. What fct_camera_event.zone_id points at.
      - name: rule_id
        description: >
          The rule's id within the zone. What fct_camera_event.rule_id points at. Null on a
          zone with no rules, which still appears rather than vanishing.
      - name: camera_id
        description: >
          Which camera. `outdoor-camera` is Entrance, `indoor-camera` is Ferme.
      - name: zone_name
        description: >
          The zone's display name.
      - name: zone_description
        description: >
          The free-text note describing what the zone is for.
      - name: zone_scope
        description: >
          Whether the zone covers drawn shapes or the whole frame.
      - name: is_enabled
        description: >
          Whether the zone is switched on. A disabled zone fires nothing.
      - name: zone_revision
        description: >
          How many times the zone has been edited. Two snapshots sharing it are the same
          configuration.
      - name: geometry_revision
        description: >
          How many times the shapes have moved, separately from the rules. A bump can explain
          a step change in event counts that no rule change accounts for.
      - name: anchor_count
        description: >
          How many calibration anchors the zone holds.
      - name: state_reference_count
        description: >
          How many reference samples it judges open-versus-closed against.
      - name: revision_count
        description: >
          How many past configurations the zone keeps.
      - name: feedback_count
        description: >
          How many times a person has corrected what this zone concluded.
      - name: is_calibrated
        description: >
          Whether the zone has any calibration anchors at all. Zero anchors is the usual
          reason a zone's state readings are unreliable.
      - name: has_been_corrected
        description: >
          Whether anybody has ever corrected this zone's conclusions -- the zones the model
          keeps getting wrong.
      - name: does_auto_learn_anchors
        description: >
          Whether the zone re-learns its calibration on its own.
      - name: max_anchors
        description: >
          How many anchors the zone is allowed to keep.
      - name: created_at
        description: >
          When the zone was created.
      - name: created_by_name
        description: >
          Who created it. The name travels beside the hash for the same reason it does on a
          correction.
      - name: created_by_hash
        description: >
          Salted hash of whoever created it.
      - name: updated_at
        description: >
          When the zone was last edited.
      - name: updated_by_name
        description: >
          Who last edited it.
      - name: updated_by_hash
        description: >
          Salted hash of whoever last edited it.
      - name: rule_type
        description: >
          What the rule watches -- `state` for a gate, `crossing` for passages, `motion` for
          activity.
      - name: rule_name
        description: >
          The rule's display name.
      - name: is_rule_enabled
        description: >
          Whether the rule is switched on, independently of the zone.
      - name: is_gate_rule
        description: >
          Whether this rule watches a gate. The fact `rule_type = 'state'` was standing in for
          before this table existed.
      - name: does_rule_notify
        description: >
          Whether a match notifies, as opposed to only being recorded.
      - name: rule_cooldown_seconds
        description: >
          How long the rule waits before firing again. A long cooldown is a reason a busy
          period shows fewer events than it had activity.
      - name: rule_sensitivity
        description: >
          The sensitivity band the rule runs at.
      - name: rule_prompt
        description: >
          The analysis prompt the vision model is given. The only record of why a rule fires
          as it does.
      - name: rule_targets
        description: >
          Which subjects the rule looks for.
      - name: rule_states
        description: >
          The states a state rule may report.
      - name: rule_alert_on
        description: >
          Which transitions raise an alert rather than being recorded quietly.
      - name: observed_on
        description: >
          The day this configuration was observed. Not a validity range: the camera keeps no
          history, so this is when it was read and nothing more.
      - name: extracted_at
        description: >
          When this pipeline read the row. What lets a merge pick the newest version of a
          record the source has since changed.

  - name: fct_ai_gateway_call
    description: >
      One row per call through the api.ai gateway: application, key, person,
      requested and actual model, full prompt and response, tokens, cost, latency,
      status, and any camera frames attached. A streamed call whose caller never
      asked the gateway for usage figures reports zero tokens -- that is a real
      state, not a failure, and it must not be averaged away as though it cost
      nothing.
    columns:
      - name: call_key
        description: The call's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the call was recorded.
        tests: [not_null]
      - name: created_at
        description: When the call was recorded, in UTC.
        tests: [not_null]
      - name: created_hour
        description: created_at truncated to the hour.
      - name: application_id
        description: Which application made the call.
      - name: application_name
        description: >
          The application's display name, as of today. Falls back to the raw id
          when the application has been deleted or never snapshotted.
      - name: api_key_id
        description: Which API key made the call.
      - name: key_label
        description: The key's human-readable name, as of today. Falls back to the raw id.
      - name: call_source
        description: What kind of caller this was -- an agent run, a schedule, a script.
      - name: client_name
        description: The calling client's self-reported name.
      - name: client_version
        description: The calling client's self-reported version.
      - name: actor_label
        description: A human-readable label for who or what triggered the call.
      - name: actor_external_id
        description: An external identifier for the actor, where supplied.
      - name: requested_model
        description: The model alias the caller asked for.
      - name: actual_model
        description: The model that actually served the call, after routing.
      - name: was_rerouted
        description: Whether the served model differs from the one requested.
      - name: status
        description: success, failure, or whatever other outcome the gateway recorded.
      - name: failure_code
        description: Why the call failed, when it did.
      - name: input_tokens
        description: Prompt tokens, as the gateway counted them. Zero is a real state -- see the model note.
      - name: output_tokens
        description: Completion tokens.
      - name: total_tokens
        description: input_tokens plus output_tokens.
      - name: cost_eur
        description: What the call was billed at, in EUR.
      - name: latency_ms
        description: End-to-end latency the gateway observed.
      - name: conversation_id
        description: The conversation this call belongs to, where it belongs to one.
      - name: prompt
        description: >
          The full prompt sent to the model. By the owner's 2026-09-14 decision this
          is landed and queryable, reversing the earlier "prompts are personal, not
          stored" line -- see IMPLEMENTATION_PLAN.md section 15.
      - name: response
        description: The model's full response, same landing decision as prompt.
      - name: results
        description: JSON. Structured tool/function-call results the gateway recorded.
      - name: metadata
        description: >
          JSON. Everything else the gateway recorded, minus the camera frames --
          decoded separately, see frame_keys.
      - name: frame_count
        description: How many camera frames were attached to this call and successfully decoded.
      - name: frame_bytes
        description: Total bytes across the decoded frames.
      - name: frame_keys
        description: Lake object keys for the decoded frames, in order.
      - name: has_frames
        description: Whether this call had any camera frames attached.

  - name: fct_agent_run
    description: >
      One row per agent run -- every turn of work the platform did, whether or not
      it called the gateway. A run can hold several gateway calls or none; this is
      the table for "how many runs failed today", not fct_ai_gateway_call.
    columns:
      - name: run_key
        description: The run's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the run started.
        tests: [not_null]
      - name: started_at
        description: When the run began.
        tests: [not_null]
      - name: started_hour
        description: started_at truncated to the hour.
      - name: completed_at
        description: When the run finished, or null while it is still going.
      - name: duration_ms
        description: Wall-clock duration, where the run has finished.
      - name: conversation_id
        description: The conversation this run belongs to.
      - name: conversation_title
        description: That conversation's title.
      - name: agent_id
        description: Which agent the conversation runs against.
      - name: agent_name
        description: That agent's display name, as of today. Falls back to the raw id.
      - name: initiated_by_user_id
        description: Who started the run.
      - name: status
        description: pending, running, completed, failed, awaiting_input, and so on.
      - name: requested_model
        description: The model the run asked for.
      - name: actual_route
        description: The model route that actually served it.
      - name: was_rerouted
        description: Whether the actual route differs from the one requested.
      - name: failure_code
        description: Why the run failed, when it did.
      - name: input_tokens
        description: Prompt tokens across the run.
      - name: output_tokens
        description: Completion tokens across the run.
      - name: total_tokens
        description: input_tokens plus output_tokens, both coalesced to zero first.
      - name: reasoning_tokens
        description: Tokens spent on hidden reasoning, where the model reports them.
      - name: cost_eur
        description: What the run cost, in EUR.
      - name: awaiting_input_deadline
        description: When a run waiting on human input times out, where it is waiting.
      - name: is_awaiting_input
        description: Whether the run is currently waiting on human input.
      - name: report_definition_id
        description: The report definition this run was generating, where it was a report run.
      - name: is_report_run
        description: Whether this run was generating a scheduled report.
      - name: metadata
        description: JSON. Everything else recorded about the run.

  - name: fct_agent_tool_call
    description: >
      One row per tool call an agent run made -- the tool_call slice of run_steps.
      Never passes through the LLM gateway, so litellm_spend and fct_ai_gateway_call
      do not see these; "how many times did an agent call export_workbook today" has
      its answer here. Field extraction from the step's payload is best-effort --
      see the model for why, and read call_status, tool_name and server_alias with
      that caveat in mind.
    columns:
      - name: tool_call_key
        description: The run_step's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the step happened.
        tests: [not_null]
      - name: occurred_at
        description: When the step happened.
        tests: [not_null]
      - name: occurred_hour
        description: occurred_at truncated to the hour.
      - name: run_id
        description: The run this tool call belongs to.
        tests:
          - relationships: {to: ref('fct_agent_run'), field: run_key}
      - name: sequence
        description: The step's position within its run.
      - name: tool_name
        description: >
          The tool invoked, read from the step's payload where present and falling
          back to the step's own title otherwise. Best-effort -- see the model note.
      - name: server_alias
        description: Which MCP server served the tool, where the payload names one. Best-effort.
      - name: arguments_json
        description: JSON. The arguments the call was made with, where the payload carries them.
      - name: result_json
        description: JSON. What the tool returned, where the payload carries it.
      - name: call_status
        description: >
          The call's outcome, read from the payload where present; derived as
          failed/completed from the presence of an error otherwise. Best-effort.
      - name: error_message
        description: The error the call raised, when the payload records one.
      - name: duration_ms
        description: How long the call took, where the payload records it.
      - name: step_title
        description: The step's own short label.
      - name: step_description
        description: The step's own longer description.
      - name: payload
        description: JSON. The step's raw detail, unparsed -- for a question the extracted columns above do not answer.

  - name: fct_conversation_message
    description: >
      One row per message in every conversation, full text, by the owner's
      2026-09-14 decision -- see IMPLEMENTATION_PLAN.md section 15. The conversation's title and agent travel
      with each message so a listing reads like a transcript.
    columns:
      - name: message_key
        description: The message's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the message was written.
        tests: [not_null]
      - name: created_at
        description: When the message was written.
        tests: [not_null]
      - name: created_hour
        description: created_at truncated to the hour.
      - name: conversation_id
        description: The conversation this message belongs to.
      - name: conversation_title
        description: That conversation's title.
      - name: agent_id
        description: Which agent the conversation runs against.
      - name: agent_name
        description: That agent's display name, as of today. Falls back to the raw id.
      - name: conversation_owner_user_id
        description: Who owns the conversation this message belongs to.
      - name: author_user_id
        description: Who wrote the message, for a human-authored one. Null for the assistant's own messages.
      - name: run_id
        description: The run that produced this message, where one did.
        tests:
          - relationships: {to: ref('fct_agent_run'), field: run_key}
      - name: role
        description: user, assistant, system, or tool.
      - name: content
        description: The message's full text.
      - name: content_length
        description: Character length of content. Cheap to group or filter by without reading the text itself.
      - name: metadata
        description: JSON. Everything else recorded about the message.

  - name: fct_email_send
    description: Every email the platform has sent or attempted to send.
    columns:
      - name: email_send_key
        description: The send's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the send was attempted.
        tests: [not_null]
      - name: created_at
        description: When the send was attempted.
        tests: [not_null]
      - name: created_hour
        description: created_at truncated to the hour.
      - name: owner_user_id
        description: Who triggered the send.
      - name: run_id
        description: The run that triggered the send, where one did.
        tests:
          - relationships: {to: ref('fct_agent_run'), field: run_key}
      - name: approval_id
        description: The approval that authorised the send, where one was required.
      - name: was_approved
        description: Whether the send went through an approval.
      - name: template_script_id
        description: The email template script used, where one was.
      - name: template_version
        description: Which version of that template.
      - name: subject
        description: The email's subject line.
      - name: recipients
        description: JSON. Who the email was sent to.
      - name: recipient_count
        description: How many recipients.
      - name: attachments
        description: JSON. What was attached, where anything was.
      - name: attachment_count
        description: How many attachments.
      - name: has_attachments
        description: Whether anything was attached.
      - name: status
        description: sent, failed, or pending.
      - name: was_sent
        description: Whether the send succeeded.
      - name: failure_reason
        description: Why the send failed, when it did.

  - name: fct_automation_run
    description: >
      One row per run of an automation, with its step runs folded in as counts by
      outcome and a JSON array of the steps themselves.
    columns:
      - name: automation_run_key
        description: The run's id.
        tests: [not_null, unique]
      - name: partition_date
        description: The UTC day the run record was created.
        tests: [not_null]
      - name: created_at
        description: When the run record was created.
        tests: [not_null]
      - name: started_at
        description: When the run began.
      - name: finished_at
        description: When the run ended, or null while still running.
      - name: duration_ms
        description: Wall-clock duration, where the run has finished.
      - name: automation_id
        description: Which automation this is a run of.
      - name: automation_name
        description: That automation's display name, as of today. Falls back to the raw id.
      - name: dagster_run_id
        description: The underlying Dagster run id, where the automation executes as one.
      - name: status
        description: pending, running, succeeded, failed.
      - name: steps_total
        description: How many steps this run has.
      - name: steps_succeeded
        description: How many of them succeeded.
      - name: steps_failed
        description: How many failed.
      - name: steps_pending
        description: How many are still pending or running.
      - name: had_a_failed_step
        description: Whether any step in this run failed.
      - name: last_step_finished_at
        description: When the last step to finish did.
      - name: step_runs_json
        description: >
          JSON array of every step run -- id, type, label, status, timing, error --
          ordered by step_position. The detail behind the counts above.

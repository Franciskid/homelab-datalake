version: 2

models:
  - name: fct_official_stat_observation
    description: >
      One row per official figure the lake holds (Eurostat, SSMSI), at its current value,
      with how many times the publisher revised it. What politico.fraserv.fr charts.
    columns:
      - name: observation_key
        description: source, dataset, series_key, geo and period joined with |.
        tests: [not_null, unique]
      - name: source
        description: The publisher -- eurostat, ssmsi, budget (data.economie.gouv.fr) or drees.
      - name: dataset
        description: The publisher's dataset code.
      - name: series_key
        description: The value's other coordinates, as dim=code;dim=code.
      - name: geo
        description: Country or aggregate code; FR-Dnn for a French département.
      - name: period
        description: The period as the publisher writes it.
      - name: period_year
        description: The calendar year the period falls in.
      - name: value
        description: The figure.
      - name: status
        description: The publisher's flag on the value, if any.
      - name: unit
        description: The unit code, when the dataset has one.
      - name: dims_json
        description: series_key as a JSON object.
      - name: dataset_label
        description: The dataset's title, in French.
      - name: source_updated
        description: When the publisher last updated the dataset.
      - name: source_url
        description: The publisher's page for the dataset.
      - name: first_seen_at
        description: When the lake first read this value.
      - name: last_seen_at
        description: When the lake last read this value.
      - name: revisions
        description: How many times the value changed after the lake first read it.

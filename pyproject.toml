[project]
name = "homelab-datalake"
version = "0.1.0"
description = "A lakehouse over homelab sources: reverse-proxy logs, camera events, media library."
requires-python = ">=3.11"
dependencies = [
    "dagster==1.13.20",
    "dagster-webserver==1.13.20",
    "dagster-duckdb==0.29.20",
    "dagster-dbt==0.29.20",
    "dagster-postgres==0.29.20",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pyarrow>=18",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "mcp>=2.1,<3",
    "openpyxl>=3.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
geo = ["geoip2>=4.8"]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "homelab_datalake.definitions"
code_location_name = "homelab_datalake"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "BLE", "ISC", "C4"]
ignore = ["E501"]  # line-length is enforced by the formatter, not as an error

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tests/test_litellm_spend.py" = ["S101", "DTZ001"]
# One naive datetime, deliberately: the test asserts a naive timestamp is still
# treated as UTC, as a safety net in case one ever slips past the connection's own
# UTC pin -- see test_a_naive_timestamp_is_treated_as_utc.
"tests/test_ai_platform.py" = ["S101", "DTZ001"]

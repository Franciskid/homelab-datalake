# Runs on primary, next to the sources. See IMPLEMENTATION_PLAN.md section 2.
#
# The webserver and the daemon are separate services on purpose: the daemon runs
# schedules, sensors and backfills, and the UI must stay reachable to diagnose a
# failure even when the daemon is the thing that has fallen over.

services:
  dagster-webserver:
    build: .
    container_name: datalake-webserver
    restart: unless-stopped
    env_file: [.env]
    # No published port on purpose. Nginx Proxy Manager joins this network and
    # reaches the UI by container name, so Dagster -- which has no authentication of
    # its own -- is not listening anywhere an unauthenticated caller can reach.
    # See infra/npm/http.conf.
    expose:
      - "3000"
    volumes:
      - dagster_home:/dagster_home
      - warehouse:/warehouse
      # NPM's live log volume, READ-ONLY. A pipeline able to corrupt the reverse
      # proxy's logs is a pipeline able to take every service on the box offline.
      - ${PRIMARY_LOG_DIR:-/srv/npm/data/logs}:/logs/primary:ro
      # secondary's logs, landed by scripts/sync-secondary-logs.sh on the host.
      # Path is configurable because the deploy user has no root: the default sits
      # inside the deploy directory rather than under /var/lib.
      - ${AMB_LOG_DIR:-./logs/secondary}:/logs/secondary:ro
      - geoip:/geoip:ro

  dagster-daemon:
    build: .
    container_name: datalake-daemon
    restart: unless-stopped
    env_file: [.env]
    command: ["dagster-daemon", "run", "-m", "homelab_datalake.definitions"]
    volumes:
      - dagster_home:/dagster_home
      - warehouse:/warehouse
      - ${PRIMARY_LOG_DIR:-/srv/npm/data/logs}:/logs/primary:ro
      - ${AMB_LOG_DIR:-./logs/secondary}:/logs/secondary:ro
      - geoip:/geoip:ro

volumes:
  dagster_home:
  warehouse:
  geoip:

# An explicit subnet, because Docker's default address pools are fully allocated on
# this host: all fifteen private network ranges blocks and all fifteen private networks/20 blocks
# are taken by the 34 networks already running. Without this, `compose up` fails with
# "could not find an available, non-overlapping IPv4 address pool".
#
# 192.0.2.0/24 is free -- 198.51.100.0/24 and 203.0.113.0/29 are in use, and the LAN is
# 198.51.100.0/24. A /24 is ample for two containers and leaves the rest of 10/8 alone.
# The durable fix is a default-address-pools entry in /etc/docker/daemon.json, which
# needs root and a daemon restart; this does not.
networks:
  default:
    ipam:
      config:
        - subnet: 192.0.2.0/24

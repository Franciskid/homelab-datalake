# Cloudflare real-IP restoration. Managed by homelab-datalake (Stage 0).
#
# NPM already trusts Cloudflare's address ranges -- its generated
# conf.d/include/ip_ranges.conf carries all 21 published ones -- but it reads the
# client address from X-Real-IP, which Cloudflare does not send. Cloudflare sends
# CF-Connecting-IP. That single mismatch is why [rate withheld] of the access log recorded a
# Cloudflare edge instead of a visitor.
#
# This overrides the header in the server context (nginx forbids redeclaring it in
# http, where NPM sets X-Real-IP). It is included by every proxy-host server block.
#
# Fail-safe by construction: nginx only honours this header when the connecting
# socket is itself in a trusted range, so a direct client cannot forge an address.
# A request arriving without the header is left alone.
real_ip_header CF-Connecting-IP;

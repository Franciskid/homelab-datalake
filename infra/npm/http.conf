# data.example.test -> the Dagster UI.
#
# Lives in /data/nginx/custom/http.conf, an include Nginx Proxy Manager supports and
# never rewrites. That is deliberate: NPM regenerates /data/nginx/proxy_host/<id>.conf
# from its own database, so a hand-written file there would be at risk from an id
# collision and would be invisible in the UI. This path is stable, and it means the
# vhost is version-controlled in this repo rather than living only in NPM's SQLite.
#
# AUTHENTICATION IS LOAD-BEARING. Dagster's webserver has none of its own: anyone
# reaching it can materialise assets, launch backfills and read run logs. Everything
# here goes to oauth2-proxy, which completes an OIDC login against the homelab
# Keycloak realm and forwards only sessions belonging to a user holding the
# datalake-user role. Dagster is not published on any host port and is reachable from
# nowhere else. Do not point proxy_pass straight at it to "test something".
#
# /mcp is the one exception, and it is authenticated differently rather than less:
# its callers are programs holding a Keycloak service-account token, and a browser
# login flow is not something they can complete. See the location block below.

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name data.example.test;

    # The wildcard *.example.test certificate NPM already manages.
    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate     /etc/letsencrypt/live/npm-12/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-12/privkey.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # NPM's `proxy` log format prints $server as the [Sent-to] field, and its own
    # generated configs set that variable per host. This one is hand-written, so
    # without this every line here logs "using uninitialized server variable" and
    # lands in the lake with an empty upstream -- a column this pipeline's own parser
    # reads. Set it to what the request is actually proxied to.
    set $server "datalake-oauth2-proxy";

    access_log /data/logs/proxy-host-data_access.log proxy;
    error_log  /data/logs/proxy-host-data_error.log warn;

    # Docker's embedded DNS, consulted at request time rather than at config load.
    #
    # This is not a nicety. Nginx resolves a hostname in `proxy_pass` once, when the
    # config is loaded, and caches the address forever. Recreating a container gives it
    # a new IP, so every `docker compose up -d` left nginx proxying to an address
    # nothing was listening on -- a 502 that lasts until somebody thinks to reload
    # nginx, on an endpoint whose whole job is to be available to a program.
    #
    # Putting the upstream in a variable forces re-resolution on each request. The
    # cost is that nginx then discards the URI, so it has to be reattached explicitly
    # below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $datalake_mcp   "http://datalake-mcp:3333";
    set $datalake_proxy "http://datalake-oauth2-proxy:4180";

    # How an MCP client discovers where to authenticate.
    #
    # This location is not optional and its absence is invisible from a shell. A 401
    # from /mcp carries `WWW-Authenticate: ... resource_metadata="https://data.
    # example.test/.well-known/oauth-protected-resource/mcp"`, and a spec-compliant
    # client fetches exactly that URL to learn which authorization server to use.
    # Without this block it matched `location /` instead, went to oauth2-proxy, and
    # returned a 302 to an HTML login page -- so every real client failed at the first
    # step while `curl` with a hand-minted token worked perfectly, which is precisely
    # the wrong thing to have tested.
    location /.well-known/oauth-protected-resource {
        proxy_pass $datalake_mcp$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP endpoint. Bearer tokens, not browser sessions -- so it must NOT go
    # through oauth2-proxy, which would answer a programmatic client with a 302 to a
    # login page it cannot complete. It is not unauthenticated: the server verifies a
    # Keycloak-signed token carrying the datalake:query client role on every request,
    # and refuses to start over HTTP without an issuer configured.
    location /mcp {
        proxy_pass $datalake_mcp$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        # Streamable HTTP holds a response open for the duration of a session, and
        # buffering it would make every tool call appear to hang until it completed.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Reached over the datalake compose network by container name. oauth2-proxy
        # holds the session and proxies through to Dagster once the user is
        # authenticated and authorised; /oauth2/* is its own login and callback path.
        proxy_pass $datalake_proxy$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dagster streams run logs over websockets; without these the UI loads but
        # every run view stays empty. oauth2-proxy passes them through.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Backfills and long materialisations hold the connection open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

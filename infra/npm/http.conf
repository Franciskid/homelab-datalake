# data.example.test -> the Dagster UI.
#
# Lives in /data/nginx/custom/http.conf, an include Nginx Proxy Manager supports and
# never rewrites. That is deliberate: NPM regenerates /data/nginx/proxy_host/<id>.conf
# from its own database, so a hand-written file there would be at risk from an id
# collision and would be invisible in the UI. This path is stable, and it means the
# vhost is version-controlled in this repo rather than living only in NPM's SQLite.
#
# BASIC AUTH IS LOAD-BEARING. Dagster's webserver has no authentication of its own:
# anyone who reaches it can materialise assets, launch backfills and read run logs.
# It authenticates against NPM's existing access list, so no new credential was
# created for this. Do not remove auth_basic to "test something".

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name data.example.test;

    # The wildcard *.example.test certificate NPM already manages.
    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate     /etc/letsencrypt/live/npm-12/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-12/privkey.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    access_log /data/logs/proxy-host-data_access.log proxy;
    error_log  /data/logs/proxy-host-data_error.log warn;

    location / {
        auth_basic           "homelab-datalake";
        auth_basic_user_file /data/access/1;

        # Reached over the datalake compose network by container name, so the Dagster
        # port is published nowhere on the host -- not even on loopback. The proxy is
        # the only route in.
        proxy_pass http://datalake-webserver:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dagster streams run logs over websockets; without these the UI loads but
        # every run view stays empty.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Backfills and long materialisations hold the connection open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

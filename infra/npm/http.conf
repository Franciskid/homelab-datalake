# data.example.test -> the Dagster UI.
#
# Lives in /data/nginx/custom/http.conf, an include Nginx Proxy Manager supports and
# never rewrites. That is deliberate: NPM regenerates /data/nginx/proxy_host/<id>.conf
# from its own database, so a hand-written file there would be at risk from an id
# collision and would be invisible in the UI. This path is stable, and it means the
# vhost is version-controlled in this repo rather than living only in NPM's SQLite.
#
# AUTHENTICATION IS LOAD-BEARING. Dagster's webserver has none of its own: anyone
# reaching it can materialise assets, launch backfills and read run logs. Everything
# here goes to oauth2-proxy, which completes an OIDC login against the homelab
# Keycloak realm and forwards only sessions belonging to a user holding the
# datalake-user role. Dagster is not published on any host port and is reachable from
# nowhere else. Do not point proxy_pass straight at it to "test something".

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    server_name data.example.test;

    # The wildcard *.example.test certificate NPM already manages.
    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate     /etc/letsencrypt/live/npm-12/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-12/privkey.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # NPM's `proxy` log format prints $server as the [Sent-to] field, and its own
    # generated configs set that variable per host. This one is hand-written, so
    # without this every line here logs "using uninitialized server variable" and
    # lands in the lake with an empty upstream -- a column this pipeline's own parser
    # reads. Set it to what the request is actually proxied to.
    set $server "datalake-oauth2-proxy";

    access_log /data/logs/proxy-host-data_access.log proxy;
    error_log  /data/logs/proxy-host-data_error.log warn;

    location / {
        # Reached over the datalake compose network by container name. oauth2-proxy
        # holds the session and proxies through to Dagster once the user is
        # authenticated and authorised; /oauth2/* is its own login and callback path.
        proxy_pass http://datalake-oauth2-proxy:4180;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dagster streams run logs over websockets; without these the UI loads but
        # every run view stays empty. oauth2-proxy passes them through.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Backfills and long materialisations hold the connection open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

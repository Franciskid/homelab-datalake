name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src scripts tests
      - name: Compile the dbt asset manifest
        run: |
          export DBT_PROFILES_DIR="$PWD/dbt"
          cd dbt
          dbt deps
          dbt parse
      - name: Unit tests and public address guard
        run: pytest -q
      - name: Build and verify the synthetic pipeline
        run: bash scripts/demo.sh
